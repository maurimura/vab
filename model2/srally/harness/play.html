<!doctype html>
<!-- Play Sega Rally on the recomp core, in this page: keyboard in, picture and sound out, paced
     at the board's 57.524 frames a second. The sound goes through the bar's own AudioWorklet
     (web/emulator/audio.js) at the core's 44.1 kHz.
       node model2/srally/harness/serve.mjs, then open
       http://localhost:8792/model2/srally/harness/play.html?rom=srallycb
     ?rom=<set> is served from /roms/<set>.zip; &region=international|japan|us.
     Keys (the bar's): arrows steer / accelerate / brake, Z X shift down / up, A view change,
     1 start, 5 coin (two coins a credit on the factory settings). -->
<html>
<head>
<meta charset="utf-8">
<title>Sega Rally Championship</title>
<style>
  body { margin: 0; background: #000; color: #ccc; font: 14px monospace; display: flex; flex-direction: column; align-items: center; min-height: 100vh }
  canvas { image-rendering: pixelated; width: min(100vw, calc((100vh - 64px) * 4 / 3)); aspect-ratio: 4 / 3; background: #000 }
  #hud { padding: 8px; white-space: pre; text-align: center }
  #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000c; font-size: 22px; cursor: pointer; text-align: center; white-space: pre-line }
</style>
</head>
<body>
<canvas id="screen" width="496" height="384"></canvas>
<div id="hud">loading…</div>
<div id="start">loading…</div>
<script type="module">
import { Core } from "/web/emulator/libretro.js";
import createSrally from "/model2/srally/dist/srally.mjs";

const params = new URLSearchParams(location.search);
const rom = params.get("rom") ?? "srallycb";
const hud = document.getElementById("hud");
const overlay = document.getElementById("start");
const screen = document.getElementById("screen").getContext("2d");

// Keyboard -> RetroPad button ids (libretro.h).
const B = 0, Y = 1, SELECT = 2, START = 3, UP = 4, DOWN = 5, LEFT = 6, RIGHT = 7, A = 8;
const KEYS = { ArrowUp: UP, ArrowDown: DOWN, ArrowLeft: LEFT, ArrowRight: RIGHT, KeyZ: B, KeyX: A, KeyA: Y, Digit1: START, Digit5: SELECT };
const HELP = "arrows steer / accelerate / brake · Z X shift down / up · A view change · 1 start · 5 coin (two a credit)";

const fail = (what) => { overlay.textContent = `failed: ${what}`; overlay.style.color = "#f66"; };
addEventListener("error", (e) => fail(e.message));
addEventListener("unhandledrejection", (e) => fail(e.reason?.message ?? e.reason));
overlay.textContent = "starting the emulator…";
const module = await createSrally({ canvas: new OffscreenCanvas(496, 384) }); // as the worker: WebGL2 on its own canvas
if (params.has("region")) {
  const alloc = (text) => { const n = module.lengthBytesUTF8(text) + 1; const p = module._malloc(n); module.stringToUTF8(text, p, n); return p; };
  module._srally_set(alloc("region"), alloc(params.get("region")));
}

const audio = new AudioContext({ sampleRate: 44100 });
await audio.audioWorklet.addModule("/web/emulator/audio.js");
const speaker = new AudioWorkletNode(audio, "emulator-audio", { outputChannelCount: [2] });
speaker.connect(audio.destination);
const sound = new MessageChannel();
speaker.port.postMessage(sound.port1, [sound.port1]);

let picture;
const errors = [];
const core = new Core(module, {
  onFrame(rgba, width, height) { picture = new ImageData(rgba, width, height); },
  onAudio(samples) { sound.port2.postMessage(samples, [samples.buffer]); },
  onLog(level, text) { if (level >= 2) console.warn(text); if (level >= 3) errors.push(text); },
});
overlay.textContent = `downloading ${rom}.zip…`;
const response = await fetch(`/roms/${rom}.zip`);
if (!response.ok) throw new Error(`/roms/${rom}.zip: ${response.status} (serve.mjs looks for it in ~/Downloads, or ROMS=<dir>)`);
const bytes = new Uint8Array(await response.arrayBuffer());
overlay.textContent = "loading the ROM set…";
await new Promise((r) => setTimeout(r)); // let the overlay repaint before the load
const av = core.loadGame(`${rom}.zip`, bytes);
const FPS = av.fps;
overlay.textContent = "click to start";

addEventListener("keydown", (e) => { const id = KEYS[e.code]; if (id !== undefined) { core.inputs[0] |= 1 << id; e.preventDefault(); } });
addEventListener("keyup", (e) => { const id = KEYS[e.code]; if (id !== undefined) { core.inputs[0] &= ~(1 << id); e.preventDefault(); } });

overlay.addEventListener("click", () => {
  overlay.remove();
  audio.resume();
  let next = performance.now();
  let frames = 0, work = 0, since = performance.now();
  const tick = (now) => {
    if (now >= next) {
      const start = performance.now();
      core.run();
      work += performance.now() - start;
      frames++;
      next += 1000 / FPS;
      if (now - next > 100) next = now; // too far behind to catch up: just carry on
      if (picture) screen.putImageData(picture, 0, 0);
    }
    if (now - since >= 1000) {
      hud.textContent = `${rom} · ${frames} fps, ${(work / Math.max(1, frames)).toFixed(1)} ms a frame${errors.length ? ` · ${errors.at(-1)}` : ""}\n${HELP}`;
      frames = 0; work = 0; since = now;
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}, { once: true });
hud.textContent = HELP;
</script>
</body>
</html>
