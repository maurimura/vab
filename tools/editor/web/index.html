<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bar editor</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #141419;
      }
      canvas {
        display: block;
        outline: none;
      }
    </style>
  </head>
  <body>
    <!-- The editor (tools/editor/src/main.rs) draws here; make editor-web builds pkg/. -->
    <canvas id="bevy"></canvas>
    <script type="module">
      import init from "./pkg/editor.js";
      // Whether the editor was built gzipped (any build but wasm-release: see the Makefile).
      import { gzipped } from "./pkg/build.js";

      // A gzipped editor is unpacked as it downloads.
      const gunzipped = () =>
        fetch("./pkg/editor_bg.wasm.gz").then(
          (response) =>
            new Response(response.body.pipeThrough(new DecompressionStream("gzip")), {
              headers: { "content-type": "application/wasm" },
            }),
        );
      await init(gzipped ? { module_or_path: gunzipped() } : undefined).catch((error) => {
        // winit ends its web event loop by throwing this on purpose.
        if (!error.message.startsWith("Using exceptions for control flow")) {
          throw error;
        }
      });
      document.getElementById("bevy").focus();
    </script>
  </body>
</html>
