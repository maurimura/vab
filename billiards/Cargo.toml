[package]
name = "billiards"
version = "0.1.0"
edition = "2024"

# Pool physics, without Bevy, so it tests natively and every player's table can run the same
# shot the same way (client/src/pool).
[dependencies]
# The vector math Bevy uses, the same version.
glam = "0.32"
# With the `serde` feature: the rules' state, to hand a game to a player sitting down.
serde = { version = "1", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]
