<!doctype html>
<!-- Runs the Daytona core in the page the way the worker will (web build, libretro.js), shows
     the viewed cabinet's frames on a canvas and times them. Query: ?rom=daytona (served at
     /roms/<rom>.zip), &frames=600, &warmup=600, &cabinets=1|2, &view=0|1, &play (Start five times on
     every seat after the warm-up, then the accelerator held: a race, with the free play presets), &blank (no ROM: blank images, a
     toolchain test of the stub build). Results in #out and in window.bench (a promise), for
     harness/run.mjs. -->
<html>
<head>
<meta charset="utf-8">
<title>Daytona harness</title>
<style>body{background:#111;color:#ddd;font:14px monospace;margin:16px} canvas{display:block;image-rendering:pixelated;width:992px;height:768px;background:#000}</style>
</head>
<body>
<canvas id="screen" width="496" height="384"></canvas>
<pre id="out">loading…</pre>
<script type="module">
import { Core } from "/web/emulator/libretro.js";
import createDaytona from "/daytona/dist/daytona.mjs";

const params = new URLSearchParams(location.search);
const rom = params.get("rom") ?? "daytona";
const FRAMES = Number(params.get("frames") ?? 600);
const WARMUP = Number(params.get("warmup") ?? 600);
const PLAY = params.has("play");
const BLANK = params.has("blank");
const out = document.getElementById("out");
const screen = document.getElementById("screen").getContext("2d");
const lines = [];
const log = (text) => { lines.push(text); out.textContent = lines.join("\n"); };

window.bench = (async () => {
  // The worker hands every core an OffscreenCanvas; this one must ignore it.
  const module = await createDaytona({ canvas: new OffscreenCanvas(1, 1) });
  const set = (key, value) => {
    const alloc = (text) => { const n = module.lengthBytesUTF8(text) + 1; const p = module._malloc(n); module.stringToUTF8(text, p, n); return p; };
    module._daytona_set(alloc(key), alloc(value));
  };
  for (const key of ["cabinets", "view"]) if (params.has(key)) set(key, params.get(key));
  if (BLANK) set("test_blank_images", "1");
  let last;
  let lit = 0; // pixels of the last frame that are not black
  let errors = 0;
  const core = new Core(module, {
    onFrame(rgba, width, height) {
      last = new ImageData(rgba, width, height);
      lit = 0;
      for (let i = 0; i < rgba.length; i += 4) if (rgba[i] | rgba[i + 1] | rgba[i + 2]) lit++;
    },
    onAudio() {},
    onLog(level, text) { if (level >= 3) errors++; log(text); },
  });
  let bytes = new Uint8Array(4);
  if (!BLANK) {
    const response = await fetch(`/roms/${rom}.zip`);
    if (!response.ok) throw new Error(`/roms/${rom}.zip: ${response.status} (serve.mjs looks for it in ~/Downloads, or ROMS=<dir>)`);
    bytes = new Uint8Array(await response.arrayBuffer());
  }
  const t0 = performance.now();
  const av = core.loadGame(`${rom}.zip`, bytes);
  log(`loaded in ${((performance.now() - t0) / 1000).toFixed(1)} s: ${av.width}x${av.height} @ ${av.fps.toFixed(3)} Hz, ${av.sampleRate} Hz`);

  // Frames run back to back in chunks so the page stays alive and the picture updates.
  const times = [];
  const run = (n, keep) => new Promise((resolve) => {
    let left = n;
    const step = () => {
      const end = performance.now() + 12;
      while (left > 0 && performance.now() < end) {
        const start = performance.now();
        core.run();
        if (keep) times.push(performance.now() - start);
        left--;
      }
      if (last) screen.putImageData(last, 0, 0);
      left > 0 ? requestAnimationFrame(step) : resolve();
    };
    step();
  });
  await run(WARMUP, false);
  if (PLAY) {
    const START = 1 << 3, UP = 1 << 4;
    for (let i = 0; i < 5; i++) {
      core.inputs.fill(START); await run(6, false);
      core.inputs.fill(0); await run(294, false);
    }
    core.inputs.fill(UP); await run(300, false);
  }
  module.UTF8ToString(module._daytona_timings());
  await run(FRAMES, true);
  const sorted = [...times].sort((a, b) => a - b);
  const avg = times.reduce((a, b) => a + b, 0) / Math.max(1, times.length);
  const at = (q) => sorted.length ? sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * q))].toFixed(2) : "-";
  const t = JSON.parse(module.UTF8ToString(module._daytona_timings()));
  const ms = (us) => t.frames ? (us / t.frames / 1000).toFixed(2) : "-";
  const result = { frames: FRAMES, avg, median: Number(at(0.5)), p95: Number(at(0.95)), worst: sorted.at(-1), timings: t, errors };
  log(`browser: ${FRAMES} frames, ${avg.toFixed(2)} ms/frame average, ${at(0.5)} median, ${at(0.95)} p95, ${sorted.at(-1)?.toFixed(2)} worst (budget ${(1000 / av.fps).toFixed(2)})`);
  for (let k = 0; k < t.cabinets; k++)
    log(`  cabinet ${k + 1}: game code + board ${ms(t.logic[k])} ms, geometrizer ${ms(t.geometry[k])} ms, rasterizer ${ms(t.raster[k])} ms, sound board ${ms(t.sound[k])} ms`);
  log(`  resampling and mixing ${ms(t.audio)} ms; all of retro_run ${ms(t.total)} ms (${t.frames} frames ran)`);
  log(`  link: ${module.UTF8ToString(module._daytona_link_status())}`);
  try {
    let start = performance.now();
    const state = core.serialize();
    const saveMs = performance.now() - start;
    start = performance.now();
    core.unserialize(state);
    log(`state: ${state.length} bytes, save ${saveMs.toFixed(2)} ms, load ${(performance.now() - start).toFixed(2)} ms`);
  } catch (e) {
    log(`state: ${e.message}`);
  }
  log(`last frame: ${lit} of ${496 * 384} pixels lit; wasm memory ${(module.HEAPU8.length / 1048576).toFixed(0)} MB`);
  result.lines = lines;
  return result;
})().catch((e) => ({ error: String(e && e.stack || e), lines }));
</script>
</body>
</html>
