<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arcade Bar</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
        outline: none;
        /* Fingers on the game are the game's: no scrolling, zooming or selecting. */
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      /* The chat on touch screens. Its button sits right of Leave (client/src/emulator.rs). */
      #chat,
      #say input {
        height: 36px;
        box-sizing: border-box;
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 18px;
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        font-family: monospace;
      }
      #chat {
        position: fixed;
        top: 8px;
        right: 8px;
        width: 64px;
        padding: 0;
        font-size: 12px;
        touch-action: manipulation;
      }
      #say {
        position: fixed;
        top: 8px;
        left: 8px;
        right: 80px;
        margin: 0;
      }
      #say input {
        width: 100%;
        padding: 0 12px;
        outline: none;
        /* Smaller than this and iOS zooms the page in on the box. */
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <canvas id="bevy"></canvas>
    <!-- A canvas can't bring up a phone's keyboard: on touch screens the chat is typed here. -->
    <button id="chat" hidden>Chat</button>
    <form id="say" hidden>
      <input maxlength="200" enterkeyhint="send" autocomplete="off" placeholder="Say something, or /name Mauri" />
    </form>
    <script type="module">
      // wasm-bindgen output of the `client` crate (make client): the bar, the players and the
      // cabinets. Bevy reports where the player walks and starts and stops games through the
      // window functions below; the page tells it about the room and the game.
      import init, {
        cabinet_seats,
        cabinet_watchers,
        chat_said,
        chat_typed,
        game_buttons,
        game_status,
        help_welcome,
        own_name,
        player_left,
        player_moved,
        players_reset,
        table_message,
        table_packet,
        table_seats,
        push_frame,
        voice_people,
      } from "./pkg/client.js";
      // All of it, for the hooks browser tests use, in local builds only (client/src/testing.rs).
      import * as client from "./pkg/client.js";
      // Whether the client was built gzipped (any build but wasm-release: see the Makefile).
      import { gzipped } from "./pkg/build.js";
      import { Room } from "./room.js";

      // A phone or tablet: Bevy shows controls for fingers (client/src/touch.rs).
      const touch = matchMedia("(pointer: coarse)").matches;
      window.touchScreen = () => touch;
      /** What stands the player up from a cabinet. */
      const leave = touch ? "Leave" : "Esc";

      // Browsers only allow sound after a user gesture: it starts on the first key, click or
      // tap (a finger counts when it lifts, not when it lands), and again after a phone took
      // the sound away while the page was in the background.
      const audio = new AudioContext({ sampleRate: 48000 });
      await audio.audioWorklet.addModule("./emulator/audio.js");
      const speaker = new AudioWorkletNode(audio, "emulator-audio", { outputChannelCount: [2] });
      speaker.connect(audio.destination);
      for (const event of ["keydown", "pointerdown", "pointerup", "touchend"]) {
        addEventListener(event, () => audio.state === "running" || audio.resume(), { capture: true });
      }
      // iOS: play with the ring switch on silent too, as games do.
      if (navigator.audioSession) navigator.audioSession.type = "playback";

      // A phone dims and locks when nobody touches it, as when watching a game. The lock goes
      // when the page is hidden, and is taken again when it's back.
      let awake;
      async function stayAwake(on) {
        awake?.release();
        awake = undefined;
        if (!on) return;
        const lock = await navigator.wakeLock?.request("screen").catch(() => undefined);
        // Unless the player stood up meanwhile.
        if (play && !awake) awake = lock;
        else lock?.release();
      }
      document.addEventListener("visibilitychange", () => {
        if (play && document.visibilityState === "visible") stayAwake(true);
      });

      // The bar room this page is in (server/src/lib.rs): ?room=<name> for a private one.
      let room;
      let roomReady;
      const joined = new Promise((resolve) => (roomReady = resolve));
      let firstMove;
      window.roomMove = (x, y, flip) => (room ? room.move(x, y, flip) : (firstMove = [x, y, flip]));
      window.roomSay = (text) => room?.say(text) ?? false;

      // Cookies remember things for a year: the name set with /name in the chat
      // (client/src/chat.rs), and that the controls were shown (client/src/help.rs).
      const cookie = (key) => {
        const found = document.cookie.split("; ").find((part) => part.startsWith(`${key}=`));
        return found && decodeURIComponent(found.slice(key.length + 1));
      };
      const remember = (key, value) => {
        document.cookie = `${key}=${encodeURIComponent(value)}; max-age=${365 * 24 * 3600}; path=/; samesite=lax`;
      };
      window.roomName = (name) => {
        remember("name", name);
        room?.setName(name);
        own_name(name);
        myName = name;
        tableSeatsChanged();
      };

      // Everyone else's names, for saying who plays a game, and this player's own.
      const names = new Map();
      let myName = "";
      const list = (items) => (items.length < 2 ? items.join("") : `${items.slice(0, -1).join(", ")} and ${items.at(-1)}`);

      // Who this player muted: by id while they're here, and by name for next time (a cookie,
      // the latest 50). Whether their own microphone is off is remembered too.
      const muted = { ids: new Set(), names: new Set(JSON.parse(cookie("muted") ?? "[]")) };
      const isMuted = (id) => muted.ids.has(id) || muted.names.has(names.get(id)?.toLowerCase());
      let micOff = cookie("mic") === "off";
      function setMuted(id, name, on) {
        const key = name.toLowerCase();
        muted.names.delete(key);
        if (on) muted.names.add(key);
        for (const [other, otherName] of names) {
          if (other === id || otherName.toLowerCase() === key) on ? muted.ids.add(other) : muted.ids.delete(other);
        }
        if (id !== undefined) on ? muted.ids.add(id) : muted.ids.delete(id);
        remember("muted", JSON.stringify([...muted.names].slice(-50)));
      }
      // Called by Bevy (client/src/voice.rs, client/src/chat.rs).
      window.voiceToggle = (id) => play?.voice?.toggle(id);
      window.voiceToggleSeat = (seat) => play?.voice?.toggleSeat(seat);
      window.voiceToggleMic = () => play?.voice?.toggle(room.id);
      /** Mutes or unmutes someone by name (/mute, /unmute in the chat); returns the name. */
      window.voiceMute = (name, on) => {
        const key = name.toLowerCase();
        const [id, found] = [...names].find(([, other]) => other.toLowerCase() === key) ?? [];
        setMuted(id, found ?? name, on);
        return found ?? name;
      };

      /**
       * Talking with the others at our cabinet over the links the game uses (web/room.js): our
       * microphone goes to each of them and theirs plays here, unless muted. Bevy's voice panel
       * (client/src/voice.rs) shows who's there and who's talking, and toggles mutes.
       */
      class Voice {
        #cabinet;
        #seat;
        /** The others: player id -> { id, seat, link, element, analyser, loudUntil }. */
        #people = new Map();
        /** Whether each other player's microphone is on, as they last said. */
        #theirMics = new Map();
        /** Our microphone once allowed: { stream, track, analyser, loudUntil }. */
        #mic;
        /** off (not asked yet), asking, on, or blocked (not allowed, or none). */
        #micState = "off";
        #timer = setInterval(() => this.#show(), 100);
        #shown;
        #stopped = false;

        constructor(cabinet) {
          this.#cabinet = cabinet;
        }

        /** Who plays with us: our seat, and each other player's id -> { seat, link }. */
        players(seat, others) {
          this.#seat = seat;
          for (const [id, person] of this.#people) {
            if (others.get(id)?.link !== person.link) this.#forget(id);
          }
          for (const [id, { seat, link }] of others) {
            const person = this.#people.get(id);
            if (person) person.seat = seat;
            else this.#meet(id, seat, link);
          }
          if (others.size && this.#micState === "off") this.#askForMic();
        }

        /** Mutes or unmutes another player, or with our own id turns our microphone off or on. */
        toggle(id) {
          if (id !== room.id) {
            if (this.#people.has(id)) setMuted(id, names.get(id) ?? "", !isMuted(id));
            return;
          }
          if (this.#micState === "blocked") return this.#askForMic();
          micOff = !micOff;
          remember("mic", micOff ? "off" : "on");
          if (this.#mic) this.#mic.track.enabled = !micOff;
          for (const id of this.#people.keys()) this.#tell(id);
        }

        toggleSeat(seat) {
          if (seat === this.#seat) return this.toggle(room.id);
          const person = [...this.#people.values()].find((person) => person.seat === seat);
          if (person) this.toggle(person.id);
        }

        /** Another player said whether their microphone is on. */
        heard(from, { mic }) {
          this.#theirMics.set(from, mic);
        }

        stop() {
          this.#stopped = true;
          clearInterval(this.#timer);
          for (const id of [...this.#people.keys()]) this.#forget(id);
          this.#mic?.track.stop();
          voice_people("");
        }

        #meet(id, seat, link) {
          const person = { id, seat, link, loudUntil: 0 };
          this.#people.set(id, person);
          link.microphone(this.#mic?.track ?? null);
          link.onvoice = (stream) => this.#hear(person, stream);
          if (link.voice) this.#hear(person, link.voice);
          this.#tell(id);
        }

        #hear(person, stream) {
          person.element?.pause();
          // Chrome only lets a peer's audio into Web Audio (the analyser) while an element plays it.
          person.element = new Audio();
          person.element.srcObject = stream;
          person.element.muted = isMuted(person.id);
          person.element.play().catch(() => {});
          person.analyser = this.#analyser(stream);
        }

        #forget(id) {
          const person = this.#people.get(id);
          this.#people.delete(id);
          if (!person) return;
          person.link.onvoice = () => {};
          person.link.microphone(null);
          person.element?.pause();
        }

        async #askForMic() {
          this.#micState = "asking";
          try {
            const stream = await navigator.mediaDevices.getUserMedia({
              audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
            });
            const [track] = stream.getAudioTracks();
            if (this.#stopped) return track.stop();
            track.enabled = !micOff;
            this.#mic = { stream, track, analyser: this.#analyser(stream), loudUntil: 0 };
            this.#micState = "on";
            for (const { link } of this.#people.values()) link.microphone(track);
          } catch (error) {
            console.warn("Microphone:", error);
            this.#micState = "blocked";
          }
          for (const id of this.#people.keys()) this.#tell(id);
        }

        #tell(id) {
          room.message(id, { cabinet: this.#cabinet, voice: { mic: this.#micState === "on" && !micOff } });
        }

        #analyser(stream) {
          const analyser = audio.createAnalyser();
          analyser.fftSize = 1024;
          audio.createMediaStreamSource(stream).connect(analyser);
          return { analyser, samples: new Float32Array(analyser.fftSize) };
        }

        /** True while someone has been loud in the last moment. */
        #talking(who, now) {
          if (!who?.analyser) return false;
          const { analyser, samples } = who.analyser;
          analyser.getFloatTimeDomainData(samples);
          const power = samples.reduce((sum, sample) => sum + sample * sample, 0) / samples.length;
          if (Math.sqrt(power) > 0.015) who.loudUntil = now + 300;
          return now < who.loudUntil;
        }

        /**
         * Tells Bevy who's here, as lines of "id, seat, name, flags" (tab-separated, in seat
         * order), when anything changed. Flags: y you, t talking, m muted by you, o microphone
         * off, b microphone blocked, n no voice (the browsers can't reach each other directly;
         * the game goes through the room, voice can't). Nothing while there's nobody to talk to.
         */
        #show() {
          const now = performance.now();
          const people = [...this.#people.values()].map((person) => {
            const { id, seat, element } = person;
            const mute = isMuted(id);
            if (element) element.muted = mute; // names may have come in since
            const flags =
              (mute ? "m" : this.#talking(person, now) ? "t" : "") +
              (this.#theirMics.get(id) === false ? "o" : "") +
              (person.link.direct ? "" : "n");
            return { id, seat, name: names.get(id) ?? `Player ${seat + 1}`, flags };
          });
          if (people.length) {
            const mic = { blocked: "b", on: micOff ? "o" : this.#talking(this.#mic, now) ? "t" : "" }[this.#micState] ?? "";
            people.push({ id: room.id, seat: this.#seat, name: myName, flags: `y${mic}` });
          }
          const shown = people
            .sort((a, b) => a.seat - b.seat)
            .map(({ id, seat, name, flags }) => `${id}\t${seat}\t${name}\t${flags}`)
            .join("\n");
          if (shown !== this.#shown) voice_people(shown);
          this.#shown = shown;
        }
      }

      /** An emulator worker for a cabinet's game, its sound going to the speaker. */
      function emulatorWorker(onmessage) {
        const worker = new Worker("./emulator/worker.js", { type: "module" });
        worker.onmessage = ({ data }) => onmessage(data);
        const sound = new MessageChannel();
        speaker.port.postMessage(sound.port1, [sound.port1]);
        worker.postMessage({ type: "audio", port: sound.port2 }, [sound.port2]);
        return worker;
      }

      /**
       * The game at the cabinet this player sits at, alone or online with the others seated
       * there. When the players change, the lowest seat among those playing captures the game
       * and hands it to everyone, and all go on from there together (web/emulator/worker.js).
       * The lowest seat playing also streams the game to whoever watches the cabinet.
       */
      class Play {
        seat;
        /** Talking with the others playing here. */
        voice;
        #game;
        #worker;
        #packets;
        #mask = 0;
        #status = "";
        /** Our machine runs the game (not waiting to be handed one). */
        #playing = false;
        /** Who plays the game our machine runs, seat -> player id, and its last handover. */
        #players = new Map();
        #epoch = 0;
        /** Seat -> player id as the room has it. */
        #seated = new Map();
        #links = new Map();
        /** A handover for us, its message and its game arriving separately: epoch -> parts. */
        #handovers = new Map();
        #settle;
        #joinTimeout;
        /** Who watches our cabinet, whether we stream to them, and who has our stream. */
        #watchers = [];
        #streaming = false;
        #streamedTo = new Set();

        constructor(game) {
          this.#game = game;
          this.cabinet = game.cabinet;
          this.voice = new Voice(game.cabinet);
        }

        /** Who sits at our cabinet changed. */
        seated(players) {
          this.#seated = new Map(players.flatMap((id, seat) => (id === null ? [] : [[seat, id]])));
          const seat = players.indexOf(room.id);
          if (seat < 0) return; // not seated (yet)
          if (!this.#worker) return this.#start(seat);
          if (!this.#playing && this.#seated.size === 1) {
            // Everyone left before handing us their game: start it ourselves.
            this.#worker.postMessage({ type: "solo" });
            this.#nowPlaying(new Map([[seat, room.id]]));
            return;
          }
          // People often sit down together: wait a moment and hand over once.
          clearTimeout(this.#settle);
          this.#settle = setTimeout(() => this.#handOver(), 300);
        }

        /** Who watches our cabinet changed. */
        watchers(players) {
          this.#watchers = players;
          this.#stream();
          if (this.#playing) this.#show(this.#status);
        }

        input(mask) {
          this.#mask = mask;
          this.#worker?.postMessage({ type: "input", mask });
        }

        stop() {
          this.#worker?.terminate();
          clearTimeout(this.#settle);
          clearTimeout(this.#joinTimeout);
          this.voice.stop();
          for (const link of this.#links.values()) room.unlink(link);
        }

        /**
         * Another player at our cabinet said whether their microphone is on, or handed us a
         * game: its players (and its bytes, below).
         */
        message(from, { cabinet, epoch, players, voice }) {
          if (cabinet !== this.cabinet) return;
          if (voice) return this.voice.heard(from, voice);
          this.#handovers.set(epoch, { ...this.#handovers.get(epoch), players: new Map(players) });
          this.#join(epoch);
        }

        handover(from, epoch, bytes) {
          this.#handovers.set(epoch, { ...this.#handovers.get(epoch), bytes });
          this.#join(epoch);
        }

        #start(seat) {
          this.seat = seat;
          const worker = (this.#worker = emulatorWorker((data) => {
            if (data.type === "frame") push_frame(data.rgba, data.width, data.height);
            if (data.type === "buttons") game_buttons(data.buttons.map(([id, name]) => `${id}\t${name}`).join("\n"));
            if (data.type === "captured") this.#captured(data);
            if (data.type === "netplay") this.#netplay(data);
            if (data.type === "watch-state") room.watchState(data.to, data.stream, data.bytes);
            if (data.type === "watch-inputs") room.watchInputs(data.stream, data.frame, data.inputs);
          }));
          // Game packets between our worker and the other players' ([seat, packet]).
          const packets = (this.#packets = new MessageChannel());
          packets.port1.onmessage = ({ data: [seat, packet] }) =>
            this.#links.get(this.#players.get(seat))?.send(packet);

          // Cores, ROM sets, BIOS sets and start-up states (emulator/snapshot.mjs) come from R2.
          // Alone we start the game; otherwise the others hand theirs over.
          const { core, rom, bios, turns } = this.#game;
          const alone = this.#seated.size === 1;
          const start = {
            type: "start",
            core: `/fbneo/${core}/fbneo.mjs`,
            rom: `/roms/${rom}.zip`,
            files: bios ? [`/roms/${bios}.zip`] : [],
            state: `/roms/${rom}.state`,
            seat,
            turns,
            port: packets.port2,
            hold: !alone,
          };
          worker.postMessage(start, [packets.port2]);
          worker.postMessage({ type: "input", mask: this.#mask });
          if (alone) {
            this.#nowPlaying(new Map([[seat, room.id]]));
          } else {
            this.#show(`Player ${seat + 1}. Joining the game...`);
            this.#joinTimeout = setTimeout(
              () => this.#playing || this.#show(`Couldn't join the game. ${leave} and try again.`),
              20000,
            );
          }
        }

        /** If we're the lowest seat still playing, hands the game to everyone seated now. */
        #handOver() {
          if (!this.#playing) return;
          const same =
            this.#seated.size === this.#players.size &&
            [...this.#seated].every(([seat, id]) => this.#players.get(seat) === id);
          if (same) return;
          const stayed = [...this.#players].filter(([seat, id]) => this.#seated.get(seat) === id);
          if (Math.min(...stayed.map(([seat]) => seat)) !== this.seat) return;
          if (this.#seated.size === 1) {
            this.#worker.postMessage({ type: "solo" });
            this.#nowPlaying(new Map(this.#seated));
            return;
          }
          const joined = [...this.#seated.keys()].filter((seat) => !this.#players.has(seat));
          this.#show(joined.length ? `Player ${joined[0] + 1} is joining...` : "Someone left, going on without them...");
          this.#players = new Map(this.#seated);
          this.#epoch++;
          this.#worker.postMessage({ type: "capture", epoch: this.#epoch });
          this.#stream();
        }

        /** Our worker captured the game: hand it to the others, and go on with them. */
        #captured({ epoch, state }) {
          if (epoch !== this.#epoch) return;
          const players = [...this.#players].sort(([a], [b]) => a - b);
          for (const [seat, id] of players) {
            if (id === room.id) continue;
            room.message(id, { cabinet: this.cabinet, epoch, players });
            room.handOver(id, epoch, state);
          }
          this.#goOnline(epoch);
        }

        /** Joins a handed-over game once both its message and its bytes are here. */
        #join(epoch) {
          const { players, bytes } = this.#handovers.get(epoch);
          if (!players || !bytes || epoch <= this.#epoch || players.get(this.seat) !== room.id) return;
          for (const older of this.#handovers.keys()) if (older <= epoch) this.#handovers.delete(older);
          this.#epoch = epoch;
          this.#players = players;
          this.#goOnline(epoch, bytes);
        }

        #goOnline(epoch, state) {
          this.#linkPlayers();
          const seats = [...this.#players.keys()].sort((a, b) => a - b);
          this.#worker.postMessage({ type: "online", epoch, seats, state }, state ? [state.buffer] : []);
          this.#playing = true;
          this.#stream();
          this.#show(`Player ${this.seat + 1}. Connecting to ${this.#others()}...`);
        }

        #nowPlaying(players) {
          this.#playing = true;
          this.#players = players;
          this.#linkPlayers();
          this.#stream();
          const seats = this.#game.players;
          this.#show(`Player ${this.seat + 1}.${seats > 1 ? " Anyone who sits at this cabinet joins you." : ""}`);
        }

        /** A link to each other player: the lower seat offers WebRTC. */
        #linkPlayers() {
          const others = new Map([...this.#players].filter(([, id]) => id !== room.id));
          for (const [id, link] of this.#links) {
            if ([...others.values()].includes(id)) continue;
            room.unlink(link);
            this.#links.delete(id);
          }
          for (const [seat, id] of others) {
            if (this.#links.has(id)) continue;
            const link = room.link(id, this.seat < seat, `${this.cabinet}/${Math.min(id, room.id)}/${Math.max(id, room.id)}`);
            link.onpacket = (packet) => {
              const from = [...this.#players].find(([, player]) => player === id)?.[0];
              if (from !== undefined) this.#packets.port1.postMessage([from, packet], [packet]);
            };
            this.#links.set(id, link);
          }
          this.voice.players(this.seat, new Map([...others].map(([seat, id]) => [id, { seat, link: this.#links.get(id) }])));
        }

        /**
         * Streams our game to the watchers if we're the lowest seat playing: a state to each
         * one who just came (the worker sends one to all when it starts), then everyone's
         * inputs as GGRS confirms them.
         */
        #stream() {
          if (!this.#worker) return;
          const on = this.#playing && this.#watchers.length > 0 && Math.min(...this.#players.keys()) === this.seat;
          if (on !== this.#streaming) {
            this.#streaming = on;
            this.#streamedTo = new Set(on ? this.#watchers : []);
            this.#worker.postMessage({ type: "stream", on });
            return;
          }
          if (!on) return;
          for (const id of this.#watchers) {
            if (!this.#streamedTo.has(id)) this.#worker.postMessage({ type: "snapshot", to: id });
          }
          this.#streamedTo = new Set(this.#watchers);
        }

        #others() {
          const seats = [...this.#players.keys()].filter((seat) => seat !== this.seat).map((seat) => seat + 1);
          return seats.length === 1 ? `player ${seats[0]}` : `players ${seats.slice(0, -1).join(", ")} and ${seats.at(-1)}`;
        }

        #netplay({ event, seat, ping, frame }) {
          const me = `Player ${this.seat + 1}`;
          if (event === "synchronized" || event === "resumed") this.#show(`${me}, online with ${this.#others()}`);
          if (event === "interrupted") this.#show(`${me}. Waiting for player ${seat + 1}'s connection...`);
          if (event === "desync") this.#show(`${me}. Out of step with the others since frame ${frame}.`);
          if (event === "stats" && !this.#status.includes("Out of step") && !this.#status.includes("Waiting")) {
            const direct = [...this.#links.values()].every((link) => link.direct);
            this.#show(`${me}, online with ${this.#others()}, ${ping ?? "?"} ms, ${direct ? "direct" : "through the server"}`);
          }
        }

        #show(text) {
          this.#status = text;
          const watching = this.#watchers.length;
          game_status(watching ? `${text} (${watching} watching)` : text);
        }
      }

      /**
       * Watching the game at a cabinet: one of its players streams it here and our own worker
       * runs it a little behind them (web/emulator/worker.js). The room hears we watch once the
       * game is loaded, and the streaming player then sends us a state to start from.
       */
      class Watch {
        #worker;
        /** The stream our worker plays ("player/stream"), from the last state that came. */
        #source;
        #seated = [];

        constructor({ core, rom, bios, turns, cabinet }) {
          this.cabinet = cabinet;
          this.#worker = emulatorWorker((data) => {
            if (data.type === "frame") push_frame(data.rgba, data.width, data.height);
            if (data.type === "ready") joined.then(() => play === this && room.watch(this.cabinet));
          });
          this.#worker.postMessage({
            type: "start",
            core: `/fbneo/${core}/fbneo.mjs`,
            rom: `/roms/${rom}.zip`,
            files: bios ? [`/roms/${bios}.zip`] : [],
            turns,
            hold: true,
          });
        }

        /** Who sits at the cabinet changed. */
        seated(players) {
          this.#seated = players;
          this.#show();
        }

        watchState(from, stream, bytes) {
          this.#source = `${from}/${stream}`;
          this.#worker.postMessage({ type: "watch-state", bytes }, [bytes.buffer]);
          this.#show();
        }

        watchInputs(from, stream, frame, inputs) {
          if (`${from}/${stream}` !== this.#source) return;
          this.#worker.postMessage({ type: "watch-inputs", frame, inputs }, [inputs.buffer]);
        }

        input() {}

        stop() {
          this.#worker.terminate();
        }

        #show() {
          const playing = this.#seated.flatMap((id, seat) => (id === null ? [] : [names.get(id) ?? `player ${seat + 1}`]));
          if (!playing.length) return game_status(`Nobody is playing right now. ${leave} to go back.`);
          if (!this.#source) return game_status("Watching. Waiting for the game...");
          game_status(`Watching ${list(playing)}. ${leave} to go back.`);
        }
      }

      let play;
      window.emulatorPlay = async (core, rom, bios, cabinet, turns, players) => {
        play?.stop();
        const current = (play = new Play({ core, rom, bios, turns, players, cabinet }));
        stayAwake(true);
        game_status("Taking a seat...");
        await joined;
        if (play !== current) return;
        room.sit(cabinet, players);
        current.watchers(room.watchers.get(cabinet) ?? []);
      };
      window.emulatorWatch = (core, rom, bios, cabinet, turns) => {
        play?.stop();
        const current = (play = new Watch({ core, rom, bios, turns, cabinet }));
        stayAwake(true);
        game_status("Watching. Loading the game...");
        joined.then(() => play === current && current.seated(room.seats.get(cabinet) ?? []));
      };
      window.emulatorStop = () => {
        play?.stop();
        play = undefined;
        stayAwake(false);
        room?.stand();
      };
      window.emulatorInput = (mask) => play?.input(mask);

      // Pointer lock, for the air hockey table and the dartboard (client/src/pointer_lock.rs): the
      // paddle or the dart moves with the mouse, and the pointer stays put. Browsers only lock it from a click, so a click on
      // the canvas does, while Bevy wants it; Esc unlocks it (the browser's doing).
      const bevyCanvas = document.getElementById("bevy");
      let lockWanted = false;
      // No pointer lock here at all (some embedded browsers), or refused again and again: the
      // game plays without it. A single refusal is usual just after an Esc.
      let lockRefusals = 0;
      let lockFailed = !("requestPointerLock" in bevyCanvas);
      window.pointerLockWanted = (on) => {
        lockWanted = on;
        if (!on && document.pointerLockElement) document.exitPointerLock();
      };
      window.pointerLocked = () => document.pointerLockElement === bevyCanvas;
      window.pointerLockFailed = () => lockFailed;
      window.releasePointer = () => document.exitPointerLock();
      bevyCanvas.addEventListener("pointerdown", (event) => {
        if (!lockWanted || event.pointerType !== "mouse" || document.pointerLockElement) return;
        // Newer browsers return a promise, rejected when they say no (as just after an Esc).
        bevyCanvas.requestPointerLock()?.catch?.(() => {});
      });
      document.addEventListener("pointerlockerror", () => (lockFailed ||= ++lockRefusals >= 3));
      document.addEventListener("pointerlockchange", () => document.pointerLockElement && (lockRefusals = 0));

      // Tables players sit at together, the pool, air hockey and shuffleboard tables
      // (client/src/seats.rs): a place with seats in the room, as a cabinet is ("pool:x,y",
      // "hockey:x,y", "shuffleboard:x,y"). The players at one send each other what they do as
      // messages with `table` set; Bevy plays the game and says what to send.
      const isTable = (place) => ["pool:", "hockey:", "shuffleboard:"].some((kind) => place.startsWith(kind));
      window.tableSit = (table, seats) => joined.then(() => room.sit(table, seats));
      window.tableStand = () => room?.stand();
      window.tableSend = (to, json) => room?.message(to, JSON.parse(json));
      /** Tells Bevy who sits at a table (`players`, an id or null per seat) and their names. */
      function tableSeats(table, players) {
        // An empty seat is 0, an id no player has; ids go past 2^31, so unsigned.
        const ids = players.map((id) => id ?? 0);
        const seatNames = players.map((id) => (id === null ? "" : id === room.id ? myName : names.get(id) ?? ""));
        table_seats(table, room.id, Uint32Array.from(ids), seatNames);
      }
      // Rollback packets between the two players at an air hockey table (client/src/hockey/
      // online.rs), over the room's link: straight between the browsers once WebRTC connects,
      // through the room until then.
      const tableLinks = new Map();
      window.tableLink = (partner, offers, match) => {
        window.tableUnlink(partner);
        const link = room.link(partner, offers, match);
        link.onpacket = (packet) => table_packet(partner, new Uint8Array(packet));
        tableLinks.set(partner, link);
      };
      window.tableLinkDirect = (partner) => tableLinks.get(partner)?.direct ?? false;
      // ?lag=120 (development): table packets go out about that many milliseconds late, give or
      // take a third, to try the air hockey rollback over a slow connection.
      const lag = Number(new URLSearchParams(location.search).get("lag")) || 0;
      window.tableLinkSend = (partner, bytes) => {
        if (!lag) return tableLinks.get(partner)?.send(bytes);
        const copy = bytes.slice();
        setTimeout(() => tableLinks.get(partner)?.send(copy), lag * (2 / 3 + Math.random() * 2 / 3));
      };
      window.tableUnlink = (partner) => {
        const link = tableLinks.get(partner);
        if (!link) return;
        room.unlink(link);
        tableLinks.delete(partner);
      };
      /** Again for every table, after a name changed. */
      function tableSeatsChanged() {
        if (!room) return;
        for (const [table, players] of room.seats) if (isTable(table)) tableSeats(table, players);
      }

      // A gzipped client is unpacked as it downloads.
      const gunzipped = () =>
        fetch("./pkg/client_bg.wasm.gz").then(
          (response) =>
            new Response(response.body.pipeThrough(new DecompressionStream("gzip")), {
              headers: { "content-type": "application/wasm" },
            }),
        );
      await init(gzipped ? { module_or_path: gunzipped() } : undefined).catch((error) => {
        // winit ends its web event loop by throwing this on purpose.
        if (!error.message.startsWith("Using exceptions for control flow")) {
          throw error;
        }
      });

      // Browser tests' hooks (tools/e2e), in local builds only: what the game is doing, and
      // shortcuts past walking and pushing a puck by hand.
      if (client.vab_state) {
        window.vab = {
          state: () => JSON.parse(client.vab_state()),
          goTo: (name) => client.vab_go_to(name),
          standAt: (x, y, towardX, towardY) => client.vab_stand_at(x, y, towardX, towardY),
          throw: (vx, vy) => client.vab_throw(vx, vy),
          throwDart: (x, y) => client.vab_throw_dart(x, y),
          id: () => room?.id,
        };
      }

      const bar = new URLSearchParams(location.search).get("room") ?? "main";
      const scheme = location.protocol === "https:" ? "wss" : "ws";
      room = new Room(`${scheme}://${location.host}/ws/${encodeURIComponent(bar)}`, {
        welcome(name) {
          players_reset();
          own_name(name);
          myName = name;
        },
        moved(id, x, y, flip, name) {
          const renamed = names.has(id) && names.get(id) !== name;
          names.set(id, name);
          player_moved(id, x, y, flip, name);
          if (renamed) tableSeatsChanged();
        },
        left(id) {
          names.delete(id);
          player_left(id);
        },
        said: (id, name, text) => chat_said(name, text),
        seats(cabinet, players) {
          cabinet_seats(cabinet, players.filter((id) => id !== null).length);
          if (isTable(cabinet)) tableSeats(cabinet, players);
          if (play?.cabinet === cabinet) play.seated(players);
        },
        full(cabinet) {
          if (play?.cabinet === cabinet) game_status(`All seats are taken. ${leave} to go back.`);
        },
        watchers(cabinet, players) {
          cabinet_watchers(cabinet, players.length);
          if (play?.cabinet === cabinet) play.watchers?.(players);
        },
        message: (from, data) =>
          data.table ? table_message(data.table, from, JSON.stringify(data)) : play?.message?.(from, data),
        handover: (from, epoch, bytes) => play?.handover?.(from, epoch, bytes),
        watchState: (from, stream, bytes) => play?.watchState?.(from, stream, bytes),
        watchInputs: (from, stream, frame, inputs) => play?.watchInputs?.(from, stream, frame, inputs),
      }, cookie("name"));
      // First visit: the controls.
      if (!cookie("welcomed")) {
        help_welcome();
        remember("welcomed", "1");
      }
      if (firstMove) room.move(...firstMove);
      roomReady();

      if (touch) {
        const chat = document.getElementById("chat");
        const say = document.getElementById("say");
        const typed = say.querySelector("input");
        chat.hidden = false;
        // Focused from the tap itself: only then does a phone bring up its keyboard.
        chat.onclick = () => {
          say.hidden = false;
          typed.focus();
        };
        typed.onblur = () => (say.hidden = true);
        say.onsubmit = (event) => {
          event.preventDefault();
          chat_typed(typed.value);
          typed.value = "";
          typed.blur();
        };
      }
      document.getElementById("bevy").focus();
    </script>
  </body>
</html>
