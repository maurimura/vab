<!doctype html>
<!-- Runs the Supermodel core in the page the way the worker will: the module draws on an
     OffscreenCanvas, frames come back as RGBA and go on a visible canvas. Query: ?rom=vs298
     (served at /roms/<rom>.zip), &frames=600, &warmup=600, &ppc=<MHz>, &play (coin + Start after the warm-up). Results in #out and in
     window.bench (a promise), for harness/run.mjs. -->
<html>
<head>
<meta charset="utf-8">
<title>Supermodel harness</title>
<style>body{background:#111;color:#ddd;font:14px monospace;margin:16px} canvas{display:block;image-rendering:pixelated;width:992px;height:768px;background:#000}</style>
</head>
<body>
<canvas id="screen" width="496" height="384"></canvas>
<pre id="out">loading…</pre>
<script type="module">
import { Core } from "/web/emulator/libretro.js";
import createSupermodel from "/supermodel/dist/supermodel.mjs";

const params = new URLSearchParams(location.search);
const rom = params.get("rom") ?? "vs298";
const FRAMES = Number(params.get("frames") ?? 600);
const WARMUP = Number(params.get("warmup") ?? 600);
const PPC = params.get("ppc");
const PLAY = params.has("play"); // after the warm-up: a coin, then Start, through the RetroPad
const out = document.getElementById("out");
const screen = document.getElementById("screen").getContext("2d");
const lines = [];
const log = (text) => { lines.push(text); out.textContent = lines.join("\n"); };

window.bench = (async () => {
  const canvas = new OffscreenCanvas(496, 384);
  const module = await createSupermodel({ canvas });
  if (PPC) {
    const alloc = (text) => { const n = module.lengthBytesUTF8(text) + 1; const p = module._malloc(n); module.stringToUTF8(text, p, n); return p; };
    module._supermodel_set(alloc("PowerPCFrequency"), alloc(PPC));
  }
  let frames = 0;
  let last;
  let lit = 0; // pixels of the last frame that are not black
  const core = new Core(module, {
    onFrame(rgba, width, height) {
      frames++;
      last = new ImageData(rgba, width, height);
      lit = 0;
      for (let i = 0; i < rgba.length; i += 4) if (rgba[i] | rgba[i + 1] | rgba[i + 2]) lit++;
    },
    onAudio() {},
    onLog(level, text) { if (level >= 2 || !/^(\s|'|Opened |vs\d|Optional ROM)/.test(text)) log(text); },
  });
  const bytes = new Uint8Array(await (await fetch(`/roms/${rom}.zip`)).arrayBuffer());
  const t0 = performance.now();
  const av = core.loadGame(`${rom}.zip`, bytes);
  log(`loaded in ${((performance.now() - t0) / 1000).toFixed(1)} s: ${av.width}x${av.height} @ ${av.fps} Hz`);

  // Frames run back to back in chunks so the page stays alive and the picture updates.
  const times = [];
  const run = (n, keep) => new Promise((resolve) => {
    let left = n;
    const step = () => {
      const end = performance.now() + 12;
      while (left > 0 && performance.now() < end) {
        const start = performance.now();
        core.run();
        if (keep) times.push(performance.now() - start);
        left--;
      }
      if (last) screen.putImageData(last, 0, 0);
      left > 0 ? requestAnimationFrame(step) : resolve();
    };
    step();
  });
  await run(WARMUP, false);
  if (PLAY) {
    const SELECT = 1 << 2, START = 1 << 3;
    core.inputs[0] = SELECT; await run(5, false);
    core.inputs[0] = 0; await run(60, false);
    core.inputs[0] = START; await run(5, false);
    core.inputs[0] = 0; await run(120, false);
  }
  module.UTF8ToString(module._supermodel_timings());
  await run(FRAMES, true);
  const sorted = [...times].sort((a, b) => a - b);
  const avg = times.reduce((a, b) => a + b, 0) / times.length;
  const at = (q) => sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * q))].toFixed(2);
  const t = JSON.parse(module.UTF8ToString(module._supermodel_timings()));
  const ms = (us) => (us / t.frames / 1000).toFixed(2);
  const result = {
    frames: FRAMES, avg, median: Number(at(0.5)), p95: Number(at(0.95)), worst: sorted.at(-1),
    ppc: Number(ms(t.ppc)), render: Number(ms(t.render)), sound: Number(ms(t.sound)), ppcMHz: PPC ?? "default",
  };
  log(`browser${PPC ? ` (PowerPC ${PPC} MHz)` : ""}: ${FRAMES} frames, ${avg.toFixed(2)} ms/frame average, ${at(0.5)} median, ${at(0.95)} p95, ${sorted.at(-1).toFixed(2)} worst`);
  log(`  of which PowerPC board ${ms(t.ppc)} ms, Real3D + tile layers (incl. WebGL calls and read-back) ${ms(t.render)} ms, sound boards ${ms(t.sound)} ms`);
  let start = performance.now();
  const state = core.serialize();
  const saveMs = performance.now() - start;
  start = performance.now();
  core.unserialize(state);
  log(`state: ${state.length} bytes, save ${saveMs.toFixed(2)} ms, load ${(performance.now() - start).toFixed(2)} ms`);
  log(`last frame: ${lit} of ${496 * 384} pixels lit`);
  result.lines = lines;
  return result;
})().catch((e) => ({ error: String(e && e.stack || e), lines }));
</script>
</body>
</html>
