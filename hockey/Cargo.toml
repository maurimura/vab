[package]
name = "hockey"
version = "0.1.0"
edition = "2024"

# Air hockey physics, without Bevy, so it tests natively (client/src/hockey).
[dependencies]
# The vector math Bevy uses, the same version.
glam = "0.32"
# With the `serde` feature: inputs, as they go between two players' rinks.
serde = { version = "1", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]
