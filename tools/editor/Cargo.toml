[package]
name = "editor"
version = "0.1.0"
edition = "2024"
publish = false

# A desktop dev tool (`make editor`) that also builds for the web (`make editor-web`), where the
# editor Worker serves it behind Cloudflare Access and it saves to the Worker. Draw mode, which
# writes art/ and assets/tiles/, is desktop only.
[dependencies]
# Only the features the editor uses, like client/Cargo.toml, so the wasm stays smaller than
# Bevy's "2d" profile makes it.
bevy = { version = "0.19.1", default-features = false, features = [
  # App core
  "std", "async_executor", "bevy_asset", "bevy_log",
  # Window, keyboard, mouse and trackpad
  "bevy_winit", "bevy_window",
  # 2D rendering: sprites, PNG art, the grid (gizmos), and what bevy_egui draws with
  "bevy_render", "bevy_core_pipeline", "bevy_camera", "bevy_color", "bevy_image", "png",
  "bevy_mesh", "bevy_shader", "bevy_material", "bevy_sprite", "bevy_sprite_render",
  "bevy_gizmos", "bevy_gizmos_render", "bevy_picking", "bevy_ui", "bevy_ui_render",
] }
bevy_egui = "0.42"
# A save's result comes back through a channel: on the web it arrives when the Worker answers.
crossbeam-channel = "0.5"
# Compile out log calls below `warn` in release builds (see bevy_log's LogPlugin docs).
log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }
tracing = { version = "0.1", features = ["max_level_debug", "release_max_level_warn"] }
ron = "0.12"
serde = { version = "1", features = ["derive"] }
world = { path = "../../world" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Images reload when their files change; systems run on every core; Linux windows.
bevy = { version = "0.19.1", default-features = false, features = ["file_watcher", "multi_threaded", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["web", "webgl2"] }
# Saving the map to the Worker.
ehttp = "0.7"
