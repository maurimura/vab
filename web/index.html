<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arcade Bar</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
        outline: none;
        /* Fingers on the game are the game's: no scrolling, zooming or selecting. */
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      /* The chat on touch screens. Its button sits right of Leave (client/src/emulator.rs). */
      #chat,
      #say input {
        height: 36px;
        box-sizing: border-box;
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 18px;
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        font-family: monospace;
      }
      #chat {
        position: fixed;
        top: 8px;
        right: 8px;
        width: 64px;
        padding: 0;
        font-size: 12px;
        touch-action: manipulation;
      }
      #say {
        position: fixed;
        top: 8px;
        left: 8px;
        right: 80px;
        margin: 0;
      }
      #say input {
        width: 100%;
        padding: 0 12px;
        outline: none;
        /* Smaller than this and iOS zooms the page in on the box. */
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <canvas id="bevy"></canvas>
    <!-- A canvas can't bring up a phone's keyboard: on touch screens the chat is typed here. -->
    <button id="chat" hidden>Chat</button>
    <form id="say" hidden>
      <input maxlength="200" enterkeyhint="send" autocomplete="off" placeholder="Say something, or /name Mauri" />
    </form>
    <script type="module">
      // wasm-bindgen output of the `client` crate (make client): the bar, the players and the
      // cabinets. Bevy reports where the player walks and starts and stops games through the
      // window functions below; the page tells it about the room and the game.
      import init, {
        cabinet_seats,
        cabinet_watchers,
        chat_said,
        chat_typed,
        game_buttons,
        game_status,
        help_welcome,
        own_name,
        player_left,
        player_moved,
        players_reset,
        table_message,
        table_packet,
        table_seats,
        table_watchers,
        push_frame,
        voice_people,
      } from "./pkg/client.js";
      // All of it, for the hooks browser tests use, in local builds only (client/src/testing.rs).
      import * as client from "./pkg/client.js";
      // Whether the client was built gzipped (any build but wasm-release: see the Makefile).
      import { gzipped } from "./pkg/build.js";
      import { Room } from "./room.js";

      // A phone or tablet: Bevy shows controls for fingers (client/src/touch.rs).
      const touch = matchMedia("(pointer: coarse)").matches;
      window.touchScreen = () => touch;
      /** What stands the player up from a cabinet. */
      const leave = touch ? "Leave" : "Esc";

      // Browsers only allow sound after a user gesture: it starts on the first key, click or
      // tap (a finger counts when it lifts, not when it lands), and again after a phone took
      // the sound away while the page was in the background.
      const audio = new AudioContext({ sampleRate: 48000 });
      await audio.audioWorklet.addModule("./emulator/audio.js");
      const speaker = new AudioWorkletNode(audio, "emulator-audio", { outputChannelCount: [2] });
      speaker.connect(audio.destination);
      for (const event of ["keydown", "pointerdown", "pointerup", "touchend"]) {
        addEventListener(event, () => audio.state === "running" || audio.resume(), { capture: true });
      }
      // iOS: play with the ring switch on silent too, as games do.
      if (navigator.audioSession) navigator.audioSession.type = "playback";

      // A phone dims and locks when nobody touches it, as when watching a game. The lock goes
      // when the page is hidden, and is taken again when it's back.
      let awake;
      async function stayAwake(on) {
        awake?.release();
        awake = undefined;
        if (!on) return;
        const lock = await navigator.wakeLock?.request("screen").catch(() => undefined);
        // Unless the player stood up meanwhile.
        if (play && !awake) awake = lock;
        else lock?.release();
      }
      document.addEventListener("visibilitychange", () => {
        if (play && document.visibilityState === "visible") stayAwake(true);
      });

      // The bar room this page is in (server/src/lib.rs): ?room=<name> for a private one.
      let room;
      let roomReady;
      const joined = new Promise((resolve) => (roomReady = resolve));
      let firstMove;
      window.roomMove = (x, y, flip) => (room ? room.move(x, y, flip) : (firstMove = [x, y, flip]));
      window.roomSay = (text) => room?.say(text) ?? false;

      // Cookies remember things for a year: the name set with /name in the chat
      // (client/src/chat.rs), and that the controls were shown (client/src/help.rs).
      const cookie = (key) => {
        const found = document.cookie.split("; ").find((part) => part.startsWith(`${key}=`));
        return found && decodeURIComponent(found.slice(key.length + 1));
      };
      const remember = (key, value) => {
        document.cookie = `${key}=${encodeURIComponent(value)}; max-age=${365 * 24 * 3600}; path=/; samesite=lax`;
      };
      window.roomName = (name) => {
        remember("name", name);
        room?.setName(name);
        own_name(name);
        myName = name;
        tableSeatsChanged();
      };

      // Everyone else's names, for saying who plays a game, and this player's own.
      const names = new Map();
      let myName = "";
      const list = (items) => (items.length < 2 ? items.join("") : `${items.slice(0, -1).join(", ")} and ${items.at(-1)}`);

      /**
       * Where a game's core is: an FBNeo core, or a core built on its own, under its name:
       * Supermodel for the Sega Model 3 games, Daytona USA's Sega Model 2, MAME for the Namco
       * games (Tekken 3, Time Crisis II).
       */
      const OWN_CORES = ["supermodel", "daytona", "mame"];
      const coreUrl = (core) => (OWN_CORES.includes(core) ? `/${core}/${core}.mjs` : `/fbneo/${core}/fbneo.mjs`);

      // Who this player muted: by id while they're here, and by name for next time (a cookie,
      // the latest 50). Whether their own microphone is off is remembered too.
      const muted = { ids: new Set(), names: new Set(JSON.parse(cookie("muted") ?? "[]")) };
      const isMuted = (id) => muted.ids.has(id) || muted.names.has(names.get(id)?.toLowerCase());
      let micOff = cookie("mic") === "off";
      function setMuted(id, name, on) {
        const key = name.toLowerCase();
        muted.names.delete(key);
        if (on) muted.names.add(key);
        for (const [other, otherName] of names) {
          if (other === id || otherName.toLowerCase() === key) on ? muted.ids.add(other) : muted.ids.delete(other);
        }
        if (id !== undefined) on ? muted.ids.add(id) : muted.ids.delete(id);
        remember("muted", JSON.stringify([...muted.names].slice(-50)));
      }
      // Called by Bevy (client/src/voice.rs, client/src/chat.rs).
      window.voiceToggle = (id) => voice.toggle(id);
      window.voiceToggleSeat = (seat) => voice.toggleSeat(seat);
      window.voiceToggleMic = () => voice.toggle(room.id);
      /** Mutes or unmutes someone by name (/mute, /unmute in the chat); returns the name. */
      window.voiceMute = (name, on) => {
        const key = name.toLowerCase();
        const [id, found] = [...names].find(([, other]) => other.toLowerCase() === key) ?? [];
        setMuted(id, found ?? name, on);
        return found ?? name;
      };

      /**
       * Talking with whoever sits at the same place as this player, a cabinet or a table
       * (room.seats): a voice call to each of them (Room.call), our microphone going to all and
       * theirs playing here, unless muted. It follows the seats alone, so every game with seats
       * has it. Bevy's voice panel (client/src/voice.rs) shows who's there and who's talking, and
       * toggles mutes.
       */
      class Voice {
        /** Where we sit with the others, our seat there, and our id when the calls were made. */
        #place;
        #seat;
        #me;
        /** The others: player id -> { id, seat, call, element, analyser, loudUntil }. */
        #people = new Map();
        /** Whether each other player's microphone is on, as they last said. */
        #theirMics = new Map();
        /** Our microphone once allowed: { stream, track, analyser, loudUntil }. */
        #mic;
        /** off (not asked yet), asking, on, or blocked (not allowed, or none). */
        #micState = "off";
        #timer;
        #shown;

        /** Who sits where changed: talks with whoever sits with us now, and no one else. */
        seated() {
          const [place, players] = [...room.seats].find(([, players]) => players.includes(room.id)) ?? [];
          const others = new Map(
            (players ?? []).flatMap((id, seat) => (id === null || id === room.id ? [] : [[id, seat]])),
          );
          // Somewhere else now, or back with a new id after a lost connection: new calls.
          if (place !== this.#place || room.id !== this.#me) {
            for (const id of [...this.#people.keys()]) this.#forget(id);
            this.#place = place;
            this.#me = room.id;
          }
          this.#seat = players?.indexOf(room.id);
          for (const id of [...this.#people.keys()]) if (!others.has(id)) this.#forget(id);
          for (const [id, seat] of others) {
            const person = this.#people.get(id);
            if (person) person.seat = seat;
            else this.#meet(id, seat);
          }
          if (others.size) {
            if (this.#micState === "off") this.#askForMic();
            this.#timer ??= setInterval(() => this.#show(), 100);
            return;
          }
          // Nobody to talk to: the microphone goes off until there is (the browser stops
          // showing that it's in use).
          clearInterval(this.#timer);
          this.#timer = undefined;
          this.#mic?.track.stop();
          this.#mic = undefined;
          if (this.#micState !== "blocked") this.#micState = "off";
          this.#shown = "";
          voice_people("");
        }

        /** Mutes or unmutes another player, or with our own id turns our microphone off or on. */
        toggle(id) {
          if (!this.#people.size) return;
          if (id !== room.id) {
            if (this.#people.has(id)) setMuted(id, names.get(id) ?? "", !isMuted(id));
            return;
          }
          if (this.#micState === "blocked") return this.#askForMic();
          micOff = !micOff;
          remember("mic", micOff ? "off" : "on");
          if (this.#mic) this.#mic.track.enabled = !micOff;
          for (const id of this.#people.keys()) this.#tell(id);
        }

        toggleSeat(seat) {
          if (seat === this.#seat) return this.toggle(room.id);
          const person = [...this.#people.values()].find((person) => person.seat === seat);
          if (person) this.toggle(person.id);
        }

        /** Another player said whether their microphone is on. */
        heard(from, { mic }) {
          this.#theirMics.set(from, mic);
        }

        #meet(id, seat) {
          const match = `voice/${this.#place}/${Math.min(id, room.id)}/${Math.max(id, room.id)}`;
          const call = room.call(id, room.id < id, match);
          const person = { id, seat, call, loudUntil: 0 };
          this.#people.set(id, person);
          call.microphone(this.#mic?.track ?? null);
          call.onvoice = (stream) => this.#hear(person, stream);
          this.#tell(id);
        }

        #hear(person, stream) {
          person.element?.pause();
          // Chrome only lets a peer's audio into Web Audio (the analyser) while an element plays it.
          person.element = new Audio();
          person.element.srcObject = stream;
          person.element.muted = isMuted(person.id);
          person.element.play().catch(() => {});
          person.analyser = this.#analyser(stream);
        }

        #forget(id) {
          const person = this.#people.get(id);
          this.#people.delete(id);
          if (!person) return;
          room.hangUp(person.call);
          person.element?.pause();
        }

        async #askForMic() {
          this.#micState = "asking";
          try {
            const stream = await navigator.mediaDevices.getUserMedia({
              audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
            });
            const [track] = stream.getAudioTracks();
            // Everyone left while the browser asked.
            if (!this.#people.size) {
              track.stop();
              this.#micState = "off";
              return;
            }
            track.enabled = !micOff;
            this.#mic = { stream, track, analyser: this.#analyser(stream), loudUntil: 0 };
            this.#micState = "on";
            for (const { call } of this.#people.values()) call.microphone(track);
          } catch (error) {
            console.warn("Microphone:", error);
            this.#micState = "blocked";
          }
          for (const id of this.#people.keys()) this.#tell(id);
        }

        #tell(id) {
          room.message(id, { voice: { mic: this.#micState === "on" && !micOff } });
        }

        #analyser(stream) {
          const analyser = audio.createAnalyser();
          analyser.fftSize = 1024;
          audio.createMediaStreamSource(stream).connect(analyser);
          return { analyser, samples: new Float32Array(analyser.fftSize) };
        }

        /** True while someone has been loud in the last moment. */
        #talking(who, now) {
          if (!who?.analyser) return false;
          const { analyser, samples } = who.analyser;
          analyser.getFloatTimeDomainData(samples);
          const power = samples.reduce((sum, sample) => sum + sample * sample, 0) / samples.length;
          if (Math.sqrt(power) > 0.015) who.loudUntil = now + 300;
          return now < who.loudUntil;
        }

        /**
         * Tells Bevy who's here, as lines of "id, seat, name, flags" (tab-separated, in seat
         * order), when anything changed. Flags: y you, t talking, m muted by you, o microphone
         * off, b microphone blocked, c connecting, n no voice (no way between the browsers, even
         * through TURN).
         */
        #show() {
          const now = performance.now();
          const people = [...this.#people.values()].map((person) => {
            const { id, seat, element, call } = person;
            const mute = isMuted(id);
            if (element) element.muted = mute; // names may have come in since
            const flags =
              (mute ? "m" : this.#talking(person, now) ? "t" : "") +
              (this.#theirMics.get(id) === false ? "o" : "") +
              ({ connecting: "c", failed: "n" }[call.state] ?? "");
            return { id, seat, name: names.get(id) ?? `Player ${seat + 1}`, flags };
          });
          const mic = { blocked: "b", on: micOff ? "o" : this.#talking(this.#mic, now) ? "t" : "" }[this.#micState] ?? "";
          people.push({ id: room.id, seat: this.#seat, name: myName, flags: `y${mic}` });
          const shown = people
            .sort((a, b) => a.seat - b.seat)
            .map(({ id, seat, name, flags }) => `${id}\t${seat}\t${name}\t${flags}`)
            .join("\n");
          if (shown !== this.#shown) voice_people(shown);
          this.#shown = shown;
        }
      }
      const voice = new Voice();

      /** An emulator worker for a cabinet's game, its sound going to the speaker. */
      function emulatorWorker(onmessage) {
        const worker = new Worker("./emulator/worker.js", { type: "module" });
        worker.onmessage = ({ data }) => onmessage(data);
        const sound = new MessageChannel();
        speaker.port.postMessage(sound.port1, [sound.port1]);
        worker.postMessage({ type: "audio", port: sound.port2, sampleRate: audio.sampleRate }, [sound.port2]);
        return worker;
      }

      /**
       * The game at the cabinet this player sits at, alone or online with the others seated
       * there. When the players change, the lowest seat among those playing captures the game
       * and hands it to everyone, and all go on from there together (web/emulator/worker.js).
       * The lowest seat playing also streams the game to whoever watches the cabinet.
       *
       * A `linked` game (Time Crisis II) is a twin cabinet: each player plays their own board,
       * the two joined by the game's link (web/emulator/linked.js), seat 0 the red one and seat
       * 1 the blue. Its link is set at power-on, so nothing is handed over: when a second
       * player sits down, both boards start over from their side's start-up state, linked; when
       * one leaves, the other starts over alone.
       */
      class Play {
        seat;
        #game;
        #worker;
        #packets;
        /** The player's controls, as Bevy last sent them (a u32: buttons, and a lightgun's aim). */
        #input = 0;
        #status = "";
        /** Our machine runs the game (not waiting to be handed one). */
        #playing = false;
        /** Who plays the game our machine runs, seat -> player id, and its last handover. */
        #players = new Map();
        #epoch = 0;
        /** Seat -> player id as the room has it. */
        #seated = new Map();
        #links = new Map();
        /** A handover for us, its message and its game arriving separately: epoch -> parts. */
        #handovers = new Map();
        #settle;
        #joinTimeout;
        /** Who watches our cabinet, whether we stream to them, and who has our stream. */
        #watchers = [];
        #streaming = false;
        #streamedTo = new Set();
        /** When this machine last handed its game out again after a drift. */
        #resyncedAt = -Infinity;

        constructor(game) {
          this.#game = game;
          this.cabinet = game.cabinet;
          /** A lightgun game: the right mouse button is part of the game (client/src/emulator.rs). */
          this.gun = game.gun;
        }

        /** Who sits at our cabinet changed. */
        seated(players) {
          this.#seated = new Map(players.flatMap((id, seat) => (id === null ? [] : [[seat, id]])));
          const seat = players.indexOf(room.id);
          if (seat < 0) return; // not seated (yet)
          if (!this.#worker) return this.#start(seat);
          if (!this.#playing && this.#seated.size === 1) {
            // Everyone left before handing us their game: start it ourselves.
            this.#worker.postMessage({ type: "solo" });
            this.#nowPlaying(new Map([[seat, room.id]]));
            return;
          }
          // People often sit down together: wait a moment and hand over once.
          clearTimeout(this.#settle);
          this.#settle = setTimeout(() => this.#handOver(), 300);
        }

        /** Who watches our cabinet changed. */
        watchers(players) {
          this.#watchers = players;
          this.#stream();
          if (this.#playing) this.#show(this.#status);
        }

        input(input) {
          this.#input = input;
          this.#worker?.postMessage({ type: "input", input });
        }

        /** How the arrows turn a driving game's wheel (`/wheel` in the chat): our machine's alone. */
        wheel(ramp) {
          if (this.#game.wheel) this.#game.wheel = { ...this.#game.wheel, ...ramp };
          this.#worker?.postMessage({ type: "wheel", ...ramp });
        }

        stop() {
          this.#worker?.terminate();
          clearTimeout(this.#settle);
          clearTimeout(this.#joinTimeout);
          for (const link of this.#links.values()) room.unlink(link);
        }

        /**
         * Another player at our cabinet handed us a game: its players (and its bytes, below), or
         * at a linked game told us both boards start over linked.
         */
        message(from, { cabinet, epoch, players, linked }) {
          if (cabinet !== this.cabinet) return;
          this.#handovers.set(epoch, { ...this.#handovers.get(epoch), players: new Map(players), linked });
          this.#join(epoch);
        }

        handover(from, epoch, bytes) {
          this.#handovers.set(epoch, { ...this.#handovers.get(epoch), bytes });
          this.#join(epoch);
        }

        #start(seat) {
          this.seat = seat;
          const worker = (this.#worker = emulatorWorker((data) => {
            if (data.type === "frame") push_frame(data.rgba, data.width, data.height);
            if (data.type === "buttons") game_buttons(data.buttons.map(([id, name]) => `${id}\t${name}`).join("\n"));
            if (data.type === "captured") this.#captured(data);
            if (data.type === "netplay") this.#netplay(data);
            if (data.type === "watch-state") room.watchState(data.to, data.stream, data.bytes);
            if (data.type === "watch-inputs") room.watchInputs(data.stream, data.frame, data.inputs);
            if (data.type === "watch-link") room.watchLink(data.stream, data.records);
          }));
          // Game packets between our worker and the other players' ([seat, packet]).
          const packets = (this.#packets = new MessageChannel());
          packets.port1.onmessage = ({ data: [seat, packet] }) =>
            this.#links.get(this.#players.get(seat))?.send(packet);

          // Cores, ROM sets, BIOS sets and start-up states (emulator/snapshot.mjs) come from R2.
          // Alone we start the game; otherwise the others hand theirs over.
          const { core, rom, bios, turns, lockstep, gun, linked, options, wheel } = this.#game;
          const alone = this.#seated.size === 1;
          const start = {
            type: "start",
            core: coreUrl(core),
            rom: `/roms/${rom}.zip`,
            files: bios ? [`/roms/${bios}.zip`] : [],
            state: `/roms/${rom}.state`,
            seat,
            turns,
            lockstep,
            gun,
            linked,
            // A linked game's board for this seat, linked (mame/link-states.mjs).
            linkState: linked ? `/roms/${rom}-link${seat}.state` : undefined,
            options,
            // A driving game's: the arrows turn a wheel, which goes out in the input.
            wheel,
            port: packets.port2,
            hold: !alone,
          };
          worker.postMessage(start, [packets.port2]);
          worker.postMessage({ type: "input", input: this.#input });
          if (alone) {
            this.#nowPlaying(new Map([[seat, room.id]]));
          } else {
            this.#show(`Player ${seat + 1}. Joining the game...`);
            this.#joinTimeout = setTimeout(
              () => this.#playing || this.#show(`Couldn't join the game. ${leave} and try again.`),
              20000,
            );
          }
        }

        /** If we're the lowest seat still playing, hands the game to everyone seated now. */
        #handOver() {
          if (!this.#playing) return;
          const same =
            this.#seated.size === this.#players.size &&
            [...this.#seated].every(([seat, id]) => this.#players.get(seat) === id);
          if (same) return;
          const stayed = [...this.#players].filter(([seat, id]) => this.#seated.get(seat) === id);
          if (Math.min(...stayed.map(([seat]) => seat)) !== this.seat) return;
          if (this.#seated.size === 1) {
            this.#worker.postMessage({ type: "solo" });
            this.#nowPlaying(new Map(this.#seated));
            return;
          }
          const joined = [...this.#seated.keys()].filter((seat) => !this.#players.has(seat));
          this.#players = new Map(this.#seated);
          this.#epoch++;
          if (this.#game.linked) {
            // Linked boards: everyone starts over, each from their own board's start-up state.
            this.#show(`Player ${this.seat + 1}. Linking up with ${this.#others()}: both games start over...`);
            const players = [...this.#players].sort(([a], [b]) => a - b);
            for (const [, id] of players) {
              if (id !== room.id) room.message(id, { cabinet: this.cabinet, epoch: this.#epoch, players, linked: true });
            }
            this.#goOnline(this.#epoch);
            return;
          }
          this.#show(joined.length ? `Player ${joined[0] + 1} is joining...` : "Someone left, going on without them...");
          this.#worker.postMessage({ type: "capture", epoch: this.#epoch });
          this.#stream();
        }

        /**
         * Our machine and another's drifted apart (the worker compares the game's memory now
         * and then). If we're the lowest seat playing, everyone starts over from our machine,
         * as when someone joins; the others wait for that. Not twice within a short while.
         */
        #resync() {
          if (!this.#playing || Math.min(...this.#players.keys()) !== this.seat) return;
          if (performance.now() - this.#resyncedAt < 15000) return;
          this.#resyncedAt = performance.now();
          this.#epoch++;
          this.#worker.postMessage({ type: "capture", epoch: this.#epoch });
          this.#stream();
        }

        /** Our worker captured the game: hand it to the others, and go on with them. */
        #captured({ epoch, state }) {
          if (epoch !== this.#epoch) return;
          const players = [...this.#players].sort(([a], [b]) => a - b);
          for (const [seat, id] of players) {
            if (id === room.id) continue;
            room.message(id, { cabinet: this.cabinet, epoch, players });
            room.handOver(id, epoch, state);
          }
          this.#goOnline(epoch);
        }

        /**
         * Joins a handed-over game once both its message and its bytes are here (a linked
         * game's message alone: each board starts over from its own start-up state).
         */
        #join(epoch) {
          const { players, bytes, linked } = this.#handovers.get(epoch);
          if (!players || !(bytes || linked) || epoch <= this.#epoch || players.get(this.seat) !== room.id) return;
          for (const older of this.#handovers.keys()) if (older <= epoch) this.#handovers.delete(older);
          this.#epoch = epoch;
          this.#players = players;
          this.#goOnline(epoch, bytes);
        }

        async #goOnline(epoch, state) {
          this.#linkPlayers();
          this.#playing = true;
          const seats = [...this.#players.keys()].sort((a, b) => a - b);
          this.#show(`Player ${this.seat + 1}. Connecting to ${this.#others()}...`);
          // The input delay is picked from the round trip to the others, timed now: a lockstep
          // game and a heavy rollback core (Supermodel) both cover the ping to stay smooth
          // (worker.js). Cheap cores ignore it.
          const roundTrip = await this.#roundTrip();
          if (this.#epoch !== epoch) return; // the players changed again meanwhile
          this.#worker.postMessage({ type: "online", epoch, seats, state, roundTrip }, state ? [state.buffer] : []);
          this.#stream();
        }

        /** The longest round trip to the other players, in ms, or undefined if none answered. */
        async #roundTrip() {
          const times = await Promise.all([...this.#links.values()].map((link) => link.roundTrip()));
          const known = times.filter((ms) => ms !== undefined);
          return known.length ? Math.max(...known) : undefined;
        }

        #nowPlaying(players) {
          this.#playing = true;
          this.#players = players;
          this.#linkPlayers();
          this.#stream();
          const seats = this.#game.players;
          const joins = this.#game.linked
            ? " Anyone who sits here too gets the twin cabinet's other screen, linked with yours (both games start over then)."
            : seats > 1
              ? " Anyone who sits at this cabinet joins you."
              : "";
          this.#show(`Player ${this.seat + 1}.${joins}`);
        }

        /** A link to each other player: the lower seat offers WebRTC. */
        #linkPlayers() {
          const others = new Map([...this.#players].filter(([, id]) => id !== room.id));
          for (const [id, link] of this.#links) {
            if ([...others.values()].includes(id)) continue;
            room.unlink(link);
            this.#links.delete(id);
          }
          for (const [seat, id] of others) {
            if (this.#links.has(id)) continue;
            // Lockstep inputs and linked boards' bytes must all arrive: a reliable channel.
            const reliable = this.#game.lockstep || this.#game.linked;
            const link = room.link(id, this.seat < seat, `${this.cabinet}/${Math.min(id, room.id)}/${Math.max(id, room.id)}`, reliable);
            link.onpacket = (packet) => {
              const from = [...this.#players].find(([, player]) => player === id)?.[0];
              if (from !== undefined) this.#packets.port1.postMessage([from, packet], [packet]);
            };
            this.#links.set(id, link);
          }
        }

        /**
         * Streams our game to the watchers if we're the lowest seat playing: a state to each
         * one who just came (the worker sends one to all when it starts), then everyone's
         * inputs as GGRS confirms them.
         */
        #stream() {
          if (!this.#worker) return;
          const on = this.#playing && this.#watchers.length > 0 && Math.min(...this.#players.keys()) === this.seat;
          if (on !== this.#streaming) {
            this.#streaming = on;
            this.#streamedTo = new Set(on ? this.#watchers : []);
            this.#worker.postMessage({ type: "stream", on });
            return;
          }
          if (!on) return;
          for (const id of this.#watchers) {
            if (!this.#streamedTo.has(id)) this.#worker.postMessage({ type: "snapshot", to: id });
          }
          this.#streamedTo = new Set(this.#watchers);
        }

        #others() {
          const seats = [...this.#players.keys()].filter((seat) => seat !== this.seat).map((seat) => seat + 1);
          return seats.length === 1 ? `player ${seats[0]}` : `players ${seats.slice(0, -1).join(", ")} and ${seats.at(-1)}`;
        }

        #netplay({ event, seat, ping, frame, delay, rollback, fps, stalls, link, lost }) {
          const me = `Player ${this.seat + 1}`;
          if (this.#game.linked && event === "synchronized") return this.#show(`${me}, linked with ${this.#others()}`);
          if (link && event === "stats") {
            // A linked board: its own game, and the other's D frames later (worker.js).
            if (!link.heard) return this.#show(`${me}. Waiting for ${this.#others()}'s cabinet to start...`);
            const direct = [...this.#links.values()].every((link) => link.direct);
            const waits = stalls ? `, ${stalls} wait${stalls === 1 ? "" : "s"}` : "";
            this.#show(
              `${me}, linked with ${this.#others()}, ${delay} frames of delay, ${ping ?? "?"} ms, ${fps ?? "?"} fps${waits}, ` +
                `${direct ? "direct" : "through the server"}${lost ? ". Link lost: stand up and sit again to link up" : ""}`,
            );
            return;
          }
          if (event === "synchronized" || event === "resumed") this.#show(`${me}, online with ${this.#others()}`);
          if (event === "interrupted") this.#show(`${me}. Waiting for player ${seat + 1}'s connection...`);
          if (event === "desync") {
            const lowest = Math.min(...this.#players.keys());
            const from = lowest === this.seat ? "this machine" : `player ${lowest + 1}'s machine`;
            this.#show(`${me}. Out of step with player ${seat + 1} since frame ${frame}: starting over from ${from}...`);
            this.#resync();
          }
          if (event === "stats" && !this.#status.includes("Out of step") && !this.#status.includes("Waiting")) {
            const direct = [...this.#links.values()].every((link) => link.direct);
            // A lockstep game waits for the others' input when it's late (worker.js adds a frame
            // of delay when that keeps happening); such waits in the last second are shown.
            const mode = rollback === 0 ? `, ${fps ?? "?"} fps, ${delay} frames of input delay${stalls ? `, ${stalls} wait${stalls === 1 ? "" : "s"}` : ""}` : `, ${fps ?? "?"} fps`;
            this.#show(`${me}, online with ${this.#others()}, ${ping ?? "?"} ms${mode}, ${direct ? "direct" : "through the server"}`);
          }
        }

        #show(text) {
          this.#status = text;
          const watching = this.#watchers.length;
          game_status(watching ? `${text} (${watching} watching)` : text);
        }
      }

      /**
       * Watching the game at a cabinet: one of its players streams it here and our own worker
       * runs it a little behind them (web/emulator/worker.js). The room hears we watch once the
       * game is loaded, and the streaming player then sends us a state to start from. At a
       * linked game that's the lowest seat's own board (the red one while both play), with the
       * link bytes it was handed each frame.
       */
      class Watch {
        #worker;
        /** The stream our worker plays ("player/stream"), from the last state that came. */
        #source;
        #seated = [];
        /**
         * Whose screen shows, on a machine with one per seat (a `view` option, Daytona USA's
         * two linked cabinets): player 1's to start with; Left and Right go round the seats.
         * Undefined otherwise.
         */
        #view;
        /** The controls as Bevy last sent them (a u32), for what was just pressed. */
        #input = 0;

        constructor({ core, rom, bios, turns, gun, linked, cabinet, options, wheel }) {
          this.cabinet = cabinet;
          if ("view" in options) this.#view = 0;
          this.#worker = emulatorWorker((data) => {
            if (data.type === "frame") push_frame(data.rgba, data.width, data.height);
            if (data.type === "ready") joined.then(() => play === this && room.watch(this.cabinet));
          });
          this.#worker.postMessage({
            type: "start",
            core: coreUrl(core),
            rom: `/roms/${rom}.zip`,
            files: bios ? [`/roms/${bios}.zip`] : [],
            turns,
            gun,
            // The streamed board's state says whether it's linked, and on which side.
            linked,
            options,
            // A driving game's wheel comes in the player's input.
            wheel,
            hold: true,
          });
        }

        /** Who sits at the cabinet changed. */
        seated(players) {
          this.#seated = players;
          this.#show();
        }

        watchState(from, stream, bytes) {
          this.#source = `${from}/${stream}`;
          // The worker knows a second state of the stream it plays by its name (worker.js).
          this.#worker.postMessage({ type: "watch-state", bytes, stream: this.#source }, [bytes.buffer]);
          this.#show();
        }

        watchInputs(from, stream, frame, inputs) {
          if (`${from}/${stream}` !== this.#source) return;
          this.#worker.postMessage({ type: "watch-inputs", frame, inputs }, [inputs.buffer]);
        }

        /** A linked board's frames: its player's input and the link bytes it was handed. */
        watchLink(from, stream, records) {
          if (`${from}/${stream}` !== this.#source) return;
          this.#worker.postMessage({ type: "watch-link", records }, [records.buffer]);
        }

        /** A watcher's hands are off the game; on a machine with a screen per seat, Left and Right pick whose. */
        input(input) {
          const pressed = input & ~this.#input;
          this.#input = input;
          const seats = Math.max(1, this.#seated.length);
          const step = (pressed & LEFT ? -1 : 0) + (pressed & RIGHT ? 1 : 0);
          if (this.#view === undefined || !step || seats < 2) return;
          this.#view = (this.#view + step + seats) % seats;
          this.#worker.postMessage({ type: "view", view: this.#view });
          this.#show();
        }

        stop() {
          this.#worker.terminate();
        }

        #show() {
          const playing = this.#seated.flatMap((id, seat) => (id === null ? [] : [names.get(id) ?? `player ${seat + 1}`]));
          if (!playing.length) return game_status(`Nobody is playing right now. ${leave} to go back.`);
          if (!this.#source) return game_status("Watching. Waiting for the game...");
          const screen = this.#view === undefined || this.#seated.length < 2 ? "" : `, player ${this.#view + 1}'s screen (Left and Right for another)`;
          game_status(`Watching ${list(playing)}${screen}. ${leave} to go back.`);
        }
      }

      /**
       * Playing an arcade game (world::Game's `arcade`, Daytona USA): linked cabinets, as in an
       * arcade. Our browser runs only our own cabinet, from our seat's state, from the moment we
       * sit until we stand up (web/emulator/worker.js); nobody hands anything over or waits for
       * anyone. The cabinets' link data goes to every other player seated here over a link of
       * its own (web/room.js: straight between the browsers once WebRTC connects, the lower seat
       * offering; through the room until then, or when it can't), so 8 players are 28 links,
       * 7 each (voice, as wherever players sit together, follows the seats: Voice). The game's
       * own rules say who races
       * whom: Start opens a circuit select that the others can join within its countdown.
       * Watchers ask one of us for our cabinet, and that player's machine streams it to them.
       */
      class Arcade {
        seat;
        #game;
        #worker;
        #packets;
        /** The player's controls, as Bevy last sent them (a u32; an arcade game has no gun). */
        #input = 0;
        /** Seat -> player id as the room has it, and the other way round. */
        #seated = new Map();
        #seatOf = new Map();
        /** A link to each other player seated here, by player id, and our id when they were made. */
        #links = new Map();
        #linkedAs;
        /** Round trips to them, timed every few seconds (ms), by player id. */
        #roundTrips = new Map();
        #timer;
        /** Who watches the cabinet (the room's list), who asked for ours, and who has our stream. */
        #watchers = [];
        #viewers = new Set();
        #streaming = false;
        #streamedTo = new Set();
        /** The worker's last word on the cabinet: loaded (and from the seat's state), its stats. */
        #ready;
        #stats;
        /** Until when the status says our race was called off (performance.now() ms). */
        #cancelledUntil = 0;

        constructor(game) {
          this.#game = game;
          this.cabinet = game.cabinet;
        }

        /** Who sits at our cabinet changed. */
        seated(players) {
          this.#seated = new Map(players.flatMap((id, seat) => (id === null ? [] : [[seat, id]])));
          this.#seatOf = new Map([...this.#seated].map(([seat, id]) => [id, seat]));
          const seat = players.indexOf(room.id);
          if (seat < 0) return; // not seated (yet)
          // Back after a lost connection, at another seat: that's another cabinet.
          if (this.#worker && seat !== this.seat) this.#stopCabinet();
          if (!this.#worker) this.#start(seat);
          this.#linkPlayers();
          this.#worker.postMessage({ type: "link-seats", seats: Object.fromEntries(this.#seated) });
          this.#show();
        }

        /** Who watches our cabinet changed: those who left stop getting our stream. */
        watchers(players) {
          this.#watchers = players;
          for (const id of this.#viewers) if (!players.includes(id)) this.#viewers.delete(id);
          this.#stream();
          this.#show();
        }

        input(input) {
          this.#input = input;
          this.#worker?.postMessage({ type: "input", input });
        }

        /** As Play's: how the arrows turn a driving game's wheel. */
        wheel(ramp) {
          if (this.#game.wheel) this.#game.wheel = { ...this.#game.wheel, ...ramp };
          this.#worker?.postMessage({ type: "wheel", ...ramp });
        }

        /** A watcher wants our cabinet, or no longer does. */
        message(from, { cabinet, watch }) {
          if (cabinet !== this.cabinet || watch === undefined) return;
          if (watch) this.#viewers.add(from);
          else this.#viewers.delete(from);
          this.#stream();
          this.#show();
        }

        stop() {
          this.#stopCabinet();
        }

        #stopCabinet() {
          this.#worker?.terminate();
          this.#worker = undefined;
          clearInterval(this.#timer);
          for (const link of this.#links.values()) room.unlink(link);
          this.#links.clear();
          this.#roundTrips.clear();
          this.#streaming = false;
          this.#ready = this.#stats = undefined;
        }

        #start(seat) {
          this.seat = seat;
          const worker = (this.#worker = emulatorWorker((data) => {
            if (data.type === "frame") push_frame(data.rgba, data.width, data.height);
            if (data.type === "buttons") game_buttons(data.buttons.map(([id, name]) => `${id}\t${name}`).join("\n"));
            if (data.type === "ready") this.#ready = data;
            if (data.type === "arcade") this.#stats = data;
            // Someone left our race before it began, which the game would wait for forever: the
            // worker put the cabinet back in the attract mode (CabinetLink in worker.js).
            if (data.type === "arcade-cancelled") this.#cancelledUntil = performance.now() + 10000;
            if (data.type === "ready" || data.type === "arcade" || data.type === "arcade-cancelled") this.#show();
            if (data.type === "watch-state") {
              for (const id of data.to === undefined ? this.#viewers : [data.to]) room.watchState(id, data.stream, data.bytes);
            }
            if (data.type === "watch-frames") {
              for (const id of this.#viewers) room.watchFrames(id, data.stream, data.frame, data.bytes);
            }
          }));
          // Our cabinet's link data out to everyone else seated here, theirs in ([seat, packet]).
          const packets = (this.#packets = new MessageChannel());
          packets.port1.onmessage = ({ data: packet }) => this.#send(packet);
          const { core, rom, options, wheel } = this.#game;
          worker.postMessage(
            {
              type: "start",
              core: coreUrl(core),
              rom: `/roms/${rom}.zip`,
              state: `/roms/${rom}.seat${seat}.state`,
              seat,
              arcade: true,
              options,
              wheel,
              port: packets.port2,
            },
            [packets.port2],
          );
          worker.postMessage({ type: "input", input: this.#input });
          this.#timer = setInterval(() => this.#timeLinks(), 5000);
          this.#stream();
        }

        /** Our block of link data to each other player: straight where we can, once through the room for the rest. */
        #send(packet) {
          const relayed = [];
          for (const [id, link] of this.#links) {
            if (link.direct) link.send(packet);
            else relayed.push(id);
          }
          if (relayed.length) room.relaySeveral(relayed, packet);
        }

        /** A link to each other player seated here: the lower seat offers WebRTC. */
        #linkPlayers() {
          // Back after a lost connection, with a new id: links name both ids, so they start over.
          if (this.#linkedAs !== room.id) {
            for (const link of this.#links.values()) room.unlink(link);
            this.#links.clear();
            this.#linkedAs = room.id;
          }
          const others = new Map([...this.#seated].filter(([, id]) => id !== room.id));
          const ids = new Set(others.values());
          for (const [id, link] of this.#links) {
            if (ids.has(id)) continue;
            room.unlink(link);
            this.#links.delete(id);
            this.#roundTrips.delete(id);
          }
          for (const [seat, id] of others) {
            if (this.#links.has(id)) continue;
            const link = room.link(id, this.seat < seat, `${this.cabinet}/${Math.min(id, room.id)}/${Math.max(id, room.id)}`);
            link.onpacket = (packet) => {
              const from = this.#seatOf.get(id);
              if (from !== undefined) this.#packets.port1.postMessage([from, packet], [packet]);
            };
            this.#links.set(id, link);
          }
        }

        /** Times the round trip to each other player, for the status line. */
        async #timeLinks() {
          const links = [...this.#links];
          const times = await Promise.all(links.map(([, link]) => link.roundTrip(3)));
          links.forEach(([id], i) => times[i] !== undefined && this.#links.has(id) && this.#roundTrips.set(id, times[i]));
          this.#show();
        }

        /**
         * Streams our cabinet to the watchers who asked for it: a state to each newcomer (the
         * worker sends one to all when it starts), then what it runs, frame by frame.
         */
        #stream() {
          if (!this.#worker) return;
          const on = this.#viewers.size > 0;
          if (on !== this.#streaming) {
            this.#streaming = on;
            this.#streamedTo = new Set(this.#viewers);
            this.#worker.postMessage({ type: "stream", on });
            return;
          }
          if (!on) return;
          for (const id of this.#viewers) {
            if (!this.#streamedTo.has(id)) this.#worker.postMessage({ type: "snapshot", to: id });
          }
          this.#streamedTo = new Set(this.#viewers);
        }

        /**
         * The status line: our seat, how many cabinets are on the link (the core's count, or
         * who's seated until it says), how far the farthest is (half the slowest round trip),
         * and whether the link data goes through the room.
         */
        #show() {
          const me = `Player ${this.seat + 1}`;
          const watching = this.#watchers.length ? ` (${this.#watchers.length} watching)` : "";
          if (!this.#ready) return game_status(`${me}. Starting the cabinet...`);
          // The cabinet's link board, as the core says (none, off, waiting, up or lost).
          const board = this.#stats?.link?.link?.[0]?.state ?? "up";
          if (!this.#ready.state || board !== "up") return game_status(`${me}. This cabinet couldn't join the link: it plays alone.${watching}`);
          if (performance.now() < this.#cancelledUntil) return game_status(`${me}. Race cancelled: a player left before the start. Start to race again.${watching}`);
          const others = this.#seated.size - 1;
          if (others < 1) return game_status(`${me}, the only cabinet on the link: Start to race. Whoever sits down can join in during the circuit select.${watching}`);
          const linked = linkedCabinets(this.#stats?.link) ?? this.#seated.size;
          const times = [...this.#roundTrips.values()];
          const hop = times.length ? `, ${Math.max(1, Math.round(Math.max(...times) / 2))} ms` : "";
          const relayed = [...this.#links.values()].some((link) => !link.direct) ? ", through the server" : "";
          const fps = this.#stats && this.#stats.fps < 50 ? `, ${this.#stats.fps} fps` : "";
          game_status(`${me}, ${linked} cabinets linked${hop}${relayed}${fps}${watching}`);
        }
      }

      /**
       * How many cabinets the core says are on its link (Core.linkStatus), counting ours, or
       * undefined when it doesn't say.
       */
      function linkedCabinets(status) {
        const seats = status?.star?.seats;
        if (!Array.isArray(seats)) return undefined;
        return seats.filter(({ state }) => state === "self" || state === "present").length;
      }

      /**
       * Watching an arcade game: one player's cabinet at a time, the lowest seat's to start with;
       * Left and Right go round the others. We ask that player for it, their machine streams it
       * here, and our worker runs it a little behind them, the link data going in as it did on
       * theirs (web/emulator/worker.js). Another player's cabinet is their state and stream on
       * the same machine, its seat set again.
       */
      class ArcadeWatch {
        #game;
        #worker;
        /** Our worker has loaded the game, ready for a stream. */
        #ready = false;
        /** The seat we watch, the player there we asked, and the stream we play ("player/stream"). */
        #seat;
        #player;
        #source;
        #seated = [];
        /** The controls as Bevy last sent them (a u32), for what was just pressed. */
        #input = 0;

        constructor(game) {
          this.#game = game;
          this.cabinet = game.cabinet;
          const { core, rom, options, wheel } = game;
          this.#worker = emulatorWorker((data) => {
            if (data.type === "frame") push_frame(data.rgba, data.width, data.height);
            if (data.type !== "ready") return;
            this.#ready = true;
            if (this.#player !== undefined) this.#ask(true);
          });
          this.#worker.postMessage({ type: "start", core: coreUrl(core), rom: `/roms/${rom}.zip`, arcade: true, options, wheel, hold: true });
        }

        /** Who sits at the cabinet changed: if the player we watch left, another one's cabinet. */
        seated(players) {
          this.#seated = players;
          const at = this.#seat === undefined ? null : players[this.#seat] ?? null;
          if (at !== this.#player || at === null) {
            // Someone new at the seat we watch, or the next seat's player, or nobody.
            const taken = players.flatMap((id, seat) => (id === null ? [] : [seat]));
            this.#watch(at !== null ? this.#seat : taken.find((seat) => seat > (this.#seat ?? -1)) ?? taken[0]);
          }
          this.#show();
        }

        watchState(from, stream, bytes) {
          if (from !== this.#player) return;
          this.#source = `${from}/${stream}`;
          // The seat's cabinet, and the stream by its name, as Watch's (worker.js).
          this.#worker.postMessage({ type: "watch-state", bytes, stream: this.#source, seat: this.#seat }, [bytes.buffer]);
          this.#show();
        }

        watchFrames(from, stream, frame, bytes) {
          if (`${from}/${stream}` !== this.#source) return;
          this.#worker.postMessage({ type: "watch-frames", frame, bytes }, [bytes.buffer]);
        }

        /** A watcher's hands are off the game; Left and Right pick another player's cabinet. */
        input(input) {
          const pressed = input & ~this.#input;
          this.#input = input;
          const step = (pressed & LEFT ? -1 : 0) + (pressed & RIGHT ? 1 : 0);
          const taken = this.#seated.flatMap((id, seat) => (id === null ? [] : [seat]));
          if (!step || taken.length < 2) return;
          const at = Math.max(0, taken.indexOf(this.#seat));
          this.#watch(taken[(at + step + taken.length) % taken.length]);
          this.#show();
        }

        stop() {
          this.#watch(undefined);
          this.#worker.terminate();
        }

        /** Watches the cabinet at `seat` (or none): asks the player there for it. */
        #watch(seat) {
          const player = seat === undefined ? undefined : this.#seated[seat] ?? undefined;
          if (player === this.#player && seat === this.#seat) return;
          if (this.#player !== undefined) this.#ask(false);
          this.#seat = seat;
          this.#player = player;
          this.#source = undefined;
          if (player !== undefined && this.#ready) this.#ask(true);
        }

        #ask(watch) {
          room.message(this.#player, { cabinet: this.cabinet, watch });
        }

        #show() {
          const playing = this.#seated.flatMap((id, seat) => (id === null ? [] : [names.get(id) ?? `player ${seat + 1}`]));
          if (!playing.length) return game_status(`Nobody is playing right now. ${leave} to go back.`);
          const whose = names.get(this.#player) ?? `player ${this.#seat + 1}`;
          if (!this.#source) return game_status(`Watching ${whose}'s cabinet. Waiting for the game...`);
          const others = playing.length > 1 ? ` (${playing.length} playing: Left and Right for another)` : "";
          game_status(`Watching ${whose}'s cabinet, player ${this.#seat + 1}${others}. ${leave} to go back.`);
        }
      }

      /** The RetroPad's Left and Right (libretro.h), as Bevy sends them (client/src/emulator.rs). */
      const LEFT = 1 << 6;
      const RIGHT = 1 << 7;
      /** A game's settings for its core (world::Game's `options`), as Bevy sends them: JSON. */
      const coreOptions = (json) => {
        try {
          return JSON.parse(json || "{}");
        } catch {
          return {};
        }
      };
      /**
       * A driving game's wheel (world::Game's `wheel`: { lock, back, curve, span }), as Bevy
       * sends it: JSON, or nothing for a game without one.
       */
      const gameWheel = (json) => {
        try {
          return json ? JSON.parse(json) : undefined;
        } catch {
          return undefined;
        }
      };

      let play;
      window.emulatorPlay = async (core, rom, bios, cabinet, turns, players, lockstep, gun, linked, options, arcade, wheel) => {
        play?.stop();
        const game = { core, rom, bios, turns, players, cabinet, lockstep, gun, linked, options: coreOptions(options), wheel: gameWheel(wheel) };
        const current = (play = arcade ? new Arcade(game) : new Play(game));
        stayAwake(true);
        game_status("Taking a seat...");
        await joined;
        if (play !== current) return;
        room.sit(cabinet, players);
        current.watchers(room.watchers.get(cabinet) ?? []);
      };
      window.emulatorWatch = (core, rom, bios, cabinet, turns, gun, linked, options, arcade, wheel) => {
        play?.stop();
        const game = { core, rom, bios, turns, gun, linked, cabinet, options: coreOptions(options), wheel: gameWheel(wheel) };
        const current = (play = arcade ? new ArcadeWatch(game) : new Watch(game));
        stayAwake(true);
        game_status("Watching. Loading the game...");
        joined.then(() => {
          if (play !== current) return;
          // An arcade game's watcher asks a player for their cabinet itself (ArcadeWatch).
          if (arcade) room.watch(cabinet);
          current.seated(room.seats.get(cabinet) ?? []);
        });
      };
      window.emulatorStop = () => {
        play?.stop();
        play = undefined;
        stayAwake(false);
        room?.stand();
      };
      // The player's controls (client/src/emulator.rs): a u32, the RetroPad mask in the low 16
      // bits and, at a lightgun game, where it aims in the high 16 (web/emulator/worker.js).
      window.emulatorInput = (input) => play?.input(input);
      // `/wheel` in the chat (client/src/emulator.rs): how the arrows turn the wheel of the
      // driving game being played, JSON { lock, back, curve } (any of them).
      window.emulatorWheel = (json) => play?.wheel?.(JSON.parse(json));

      // Pointer lock, for the air hockey table and the dartboard (client/src/pointer_lock.rs): the
      // paddle or the dart moves with the mouse, and the pointer stays put. Browsers only lock it from a click, so a click on
      // the canvas does, while Bevy wants it; Esc unlocks it (the browser's doing).
      const bevyCanvas = document.getElementById("bevy");
      let lockWanted = false;
      // No pointer lock here at all (some embedded browsers), or refused again and again: the
      // game plays without it. A single refusal is usual just after an Esc.
      let lockRefusals = 0;
      let lockFailed = !("requestPointerLock" in bevyCanvas);
      window.pointerLockWanted = (on) => {
        lockWanted = on;
        if (!on && document.pointerLockElement) document.exitPointerLock();
      };
      window.pointerLocked = () => document.pointerLockElement === bevyCanvas;
      window.pointerLockFailed = () => lockFailed;
      window.releasePointer = () => document.exitPointerLock();
      bevyCanvas.addEventListener("pointerdown", (event) => {
        if (!lockWanted || event.pointerType !== "mouse" || document.pointerLockElement) return;
        // Newer browsers return a promise, rejected when they say no (as just after an Esc).
        bevyCanvas.requestPointerLock()?.catch?.(() => {});
      });
      document.addEventListener("pointerlockerror", () => (lockFailed ||= ++lockRefusals >= 3));
      document.addEventListener("pointerlockchange", () => document.pointerLockElement && (lockRefusals = 0));
      // At a lightgun game the right button works the pedal: no browser menu over the game.
      bevyCanvas.addEventListener("contextmenu", (event) => play?.gun && event.preventDefault());

      // Tables players sit at together, the pool, air hockey and shuffleboard tables and the
      // dartboard (client/src/seats.rs): a place with seats in the room, as a cabinet is
      // ("pool:x,y", "hockey:x,y", "shuffleboard:x,y", "darts:x,y"). The players at one send each
      // other what they do as messages with `table` set, and whoever watches the table gets them
      // too (sent to 0, the room passes them to every watcher); Bevy plays the game and says
      // what to send.
      const isTable = (place) =>
        ["pool:", "hockey:", "shuffleboard:", "darts:"].some((kind) => place.startsWith(kind));
      window.tableSit = (table, seats) => joined.then(() => room.sit(table, seats));
      window.tableWatch = (table) => joined.then(() => room.watch(table));
      window.tableStand = () => room?.stand();
      window.tableSend = (to, json) => room?.message(to, JSON.parse(json));
      /** Tells Bevy who sits at a table (`players`, an id or null per seat) and their names. */
      function tableSeats(table, players) {
        // An empty seat is 0, an id no player has; ids go past 2^31, so unsigned.
        const ids = players.map((id) => id ?? 0);
        const seatNames = players.map((id) => (id === null ? "" : id === room.id ? myName : names.get(id) ?? ""));
        table_seats(table, room.id, Uint32Array.from(ids), seatNames);
      }
      // Rollback packets between the two players at an air hockey table (client/src/hockey/
      // online.rs), over the room's link: straight between the browsers once WebRTC connects,
      // through the room until then.
      const tableLinks = new Map();
      window.tableLink = (partner, offers, match) => {
        window.tableUnlink(partner);
        const link = room.link(partner, offers, match);
        link.onpacket = (packet) => table_packet(partner, new Uint8Array(packet));
        tableLinks.set(partner, link);
      };
      window.tableLinkDirect = (partner) => tableLinks.get(partner)?.direct ?? false;
      // ?lag=120 (development): table packets go out about that many milliseconds late, give or
      // take a third, to try the air hockey rollback over a slow connection.
      const lag = Number(new URLSearchParams(location.search).get("lag")) || 0;
      window.tableLinkSend = (partner, bytes) => {
        if (!lag) return tableLinks.get(partner)?.send(bytes);
        const copy = bytes.slice();
        setTimeout(() => tableLinks.get(partner)?.send(copy), lag * (2 / 3 + Math.random() * 2 / 3));
      };
      window.tableUnlink = (partner) => {
        const link = tableLinks.get(partner);
        if (!link) return;
        room.unlink(link);
        tableLinks.delete(partner);
      };
      /** Again for every table, after a name changed. */
      function tableSeatsChanged() {
        if (!room) return;
        for (const [table, players] of room.seats) if (isTable(table)) tableSeats(table, players);
      }

      // A gzipped client is unpacked as it downloads.
      const gunzipped = () =>
        fetch("./pkg/client_bg.wasm.gz").then(
          (response) =>
            new Response(response.body.pipeThrough(new DecompressionStream("gzip")), {
              headers: { "content-type": "application/wasm" },
            }),
        );
      await init(gzipped ? { module_or_path: gunzipped() } : undefined).catch((error) => {
        // winit ends its web event loop by throwing this on purpose.
        if (!error.message.startsWith("Using exceptions for control flow")) {
          throw error;
        }
      });

      // Browser tests' hooks (tools/e2e), in local builds only: what the game is doing, and
      // shortcuts past walking and pushing a puck by hand.
      if (client.vab_state) {
        window.vab = {
          state: () => JSON.parse(client.vab_state()),
          goTo: (name) => client.vab_go_to(name),
          standAt: (x, y, towardX, towardY) => client.vab_stand_at(x, y, towardX, towardY),
          throw: (vx, vy) => client.vab_throw(vx, vy),
          throwDart: (x, y) => client.vab_throw_dart(x, y),
          id: () => room?.id,
        };
      }

      const bar = new URLSearchParams(location.search).get("room") ?? "main";
      const scheme = location.protocol === "https:" ? "wss" : "ws";
      room = new Room(`${scheme}://${location.host}/ws/${encodeURIComponent(bar)}`, {
        welcome(name) {
          players_reset();
          own_name(name);
          myName = name;
          voice.seated();
        },
        moved(id, x, y, flip, name) {
          const renamed = names.has(id) && names.get(id) !== name;
          names.set(id, name);
          player_moved(id, x, y, flip, name);
          if (renamed) tableSeatsChanged();
        },
        left(id) {
          names.delete(id);
          player_left(id);
        },
        said: (id, name, text) => chat_said(name, text),
        seats(cabinet, players) {
          voice.seated();
          cabinet_seats(cabinet, players.filter((id) => id !== null).length);
          if (isTable(cabinet)) tableSeats(cabinet, players);
          if (play?.cabinet === cabinet) play.seated(players);
        },
        full(cabinet) {
          if (play?.cabinet === cabinet) game_status(`All seats are taken. ${leave} to go back.`);
        },
        watchers(cabinet, players) {
          cabinet_watchers(cabinet, players.length);
          if (isTable(cabinet)) table_watchers(cabinet, Uint32Array.from(players));
          if (play?.cabinet === cabinet) play.watchers?.(players);
        },
        message(from, data) {
          if (data.voice) voice.heard(from, data.voice);
          else if (data.table) table_message(data.table, from, JSON.stringify(data));
          else play?.message?.(from, data);
        },
        handover: (from, epoch, bytes) => play?.handover?.(from, epoch, bytes),
        watchState: (from, stream, bytes) => play?.watchState?.(from, stream, bytes),
        watchInputs: (from, stream, frame, inputs) => play?.watchInputs?.(from, stream, frame, inputs),
        watchFrames: (from, stream, frame, bytes) => play?.watchFrames?.(from, stream, frame, bytes),
        watchLink: (from, stream, records) => play?.watchLink?.(from, stream, records),
      }, cookie("name"));
      // First visit: the controls.
      if (!cookie("welcomed")) {
        help_welcome();
        remember("welcomed", "1");
      }
      if (firstMove) room.move(...firstMove);
      roomReady();

      if (touch) {
        const chat = document.getElementById("chat");
        const say = document.getElementById("say");
        const typed = say.querySelector("input");
        chat.hidden = false;
        // Focused from the tap itself: only then does a phone bring up its keyboard.
        chat.onclick = () => {
          say.hidden = false;
          typed.focus();
        };
        typed.onblur = () => (say.hidden = true);
        say.onsubmit = (event) => {
          event.preventDefault();
          chat_typed(typed.value);
          typed.value = "";
          typed.blur();
        };
      }
      document.getElementById("bevy").focus();
    </script>
  </body>
</html>
