[package]
name = "world"
version = "0.1.0"
edition = "2024"

[features]
default = ["bevy"]
# Drawing a map and loading one as an asset. Off, the crate is just the map format, for the
# Worker to check a map before it stores it.
bevy = ["dep:bevy"]

[dependencies]
# Only what drawing a map needs, so crates using it keep their own lean feature lists.
bevy = { version = "0.19.1", default-features = false, features = ["bevy_asset", "bevy_image", "bevy_sprite", "png"], optional = true }
ron = "0.12"
serde = { version = "1", features = ["derive"] }
